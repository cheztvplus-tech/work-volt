<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Volt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ─── Base ─── */
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }

    /* ─── Transitions ─── */
    .fade-in  { animation: fadeIn 0.25s ease both; }
    .slide-up { animation: slideUp 0.3s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    /* ─── Splash ─── */
    #splash-screen { transition: opacity 0.4s ease, visibility 0.4s ease; }
    #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ─── Splash bolt pulse ─── */
    .bolt-pulse { animation: boltPulse 2s ease-in-out infinite; }
    @keyframes boltPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.85} }

    /* ─── Nav item active ─── */
    .nav-item { transition: background 0.15s, color 0.15s; }
    .nav-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .nav-item.active i { color: #2563eb; }

    /* ─── Notification dropdown ─── */
    #notification-dropdown {
      position: fixed;
      right: 0.5rem; left: 0.5rem;
      top: 4rem;
      max-height: 80vh;
      z-index: 60;
    }
    @media (min-width: 640px) {
      #notification-dropdown {
        position: absolute;
        right: 0; left: auto;
        top: auto; margin-top: 0.5rem;
        width: 22rem;
      }
    }

    /* ─── Kanban scrollbar ─── */
    .kanban-scroll::-webkit-scrollbar { height: 6px; }
    .kanban-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* ─── Card hover ─── */
    .card-hover { transition: transform 0.18s, box-shadow 0.18s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 28px -6px rgba(0,0,0,.12); }

    /* ─── Sortable ghost ─── */
    .sortable-ghost { opacity: 0.35; background: #e2e8f0; border: 2px dashed #94a3b8; }

    /* ─── Chart container ─── */
    .chart-container { position: relative; height: 250px; width: 100%; }
    .chart-container canvas { max-height: 250px !important; width: 100% !important; }

    /* ─── Modal blur overlay ─── */
    .modal-overlay { backdrop-filter: blur(4px); }

    /* ─── Skeleton loader ─── */
    .skeleton {
      background: linear-gradient(90deg, #f0f4f8 25%, #e2e8f0 50%, #f0f4f8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ─── Input focus ring ─── */
    .field { width:100%; padding:.6rem .875rem; border:1.5px solid #e2e8f0; border-radius:10px; font-size:.875rem; outline:none; transition:border-color .15s, box-shadow .15s; font-family:inherit; }
    .field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .field::placeholder { color:#94a3b8; }

    /* ─── Btn primary ─── */
    .btn-primary { display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.65rem 1.25rem; background:#2563eb; color:#fff; border:none; border-radius:10px; font-size:.875rem; font-weight:600; cursor:pointer; transition:background .15s, transform .1s; font-family:inherit; }
    .btn-primary:hover { background:#1d4ed8; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; }

    /* ─── Btn secondary ─── */
    .btn-secondary { display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.65rem 1.25rem; background:#f1f5f9; color:#475569; border:none; border-radius:10px; font-size:.875rem; font-weight:600; cursor:pointer; transition:background .15s; font-family:inherit; }
    .btn-secondary:hover { background:#e2e8f0; }

    /* ─── Toast ─── */
    #toast-container { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; display:flex; flex-direction:column; gap:.5rem; pointer-events:none; }
    .toast { display:flex; align-items:center; gap:.75rem; padding:.75rem 1.1rem; border-radius:12px; font-size:.875rem; font-weight:500; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.18); animation:toastIn .3s cubic-bezier(.16,1,.3,1); pointer-events:auto; max-width:360px; }
    .toast.success { background:#16a34a; }
    .toast.error   { background:#dc2626; }
    .toast.info    { background:#2563eb; }
    .toast.warning { background:#d97706; }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(12px)} }

    /* ─── Scrollbar thin ─── */
    .thin-scroll::-webkit-scrollbar { width:4px; }
    .thin-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }

    /* ─── Mobile sidebar overlay ─── */
    #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
    #sidebar-overlay.visible { display:block; }

    /* ─── Responsive mobile tweaks ─── */
    @media (max-width: 768px) {
      #sidebar { position:fixed; top:0; left:0; height:100vh; z-index:50; transform:translateX(-100%); transition:transform .25s ease; }
      #sidebar.open { transform:translateX(0); }
    }
    @media (max-width: 640px) {
      .chart-container { height: 200px; }
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- ══════════════════════════════════════════
       SPLASH SCREEN
  ══════════════════════════════════════════ -->
  <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800">
    <div class="flex flex-col items-center gap-8">
      <div class="relative">
        <div class="absolute inset-0 bg-white/20 rounded-3xl blur-xl scale-110"></div>
        <div class="relative inline-flex items-center justify-center w-24 h-24 bg-white/15 border border-white/30 rounded-3xl shadow-2xl backdrop-blur-sm bolt-pulse">
          <i class="fas fa-bolt text-white text-5xl"></i>
        </div>
      </div>
      <div class="text-center">
        <h1 class="text-4xl font-extrabold text-white tracking-tight">Work Volt</h1>
        <p class="text-blue-200 mt-1.5 text-base font-medium">Power your operations</p>
      </div>
      <div class="flex gap-2 mt-1">
        <div class="w-2 h-2 bg-white/70 rounded-full animate-bounce" style="animation-delay:0ms"></div>
        <div class="w-2 h-2 bg-white/70 rounded-full animate-bounce" style="animation-delay:150ms"></div>
        <div class="w-2 h-2 bg-white/70 rounded-full animate-bounce" style="animation-delay:300ms"></div>
      </div>
    </div>
  </div>


  <!-- ══════════════════════════════════════════
       MAIN APP SCREEN
  ══════════════════════════════════════════ -->
  <div id="app-screen" class="hidden flex flex-col min-h-screen">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 px-4 h-14 flex items-center gap-3 sticky top-0 z-30 flex-shrink-0">

      <!-- Mobile hamburger + logo -->
      <button id="mobile-menu-btn" onclick="toggleMobileSidebar()" class="lg:hidden p-2 hover:bg-slate-100 rounded-lg transition-colors">
        <i class="fas fa-bars text-slate-600"></i>
      </button>

      <!-- Back button (shown contextually) -->
      <button id="app-back-btn" onclick="appGoBack()" class="hidden p-2 hover:bg-slate-100 rounded-lg transition-colors" title="Go Back">
        <i class="fas fa-arrow-left text-slate-600"></i>
      </button>

      <!-- Logo -->
      <div class="flex items-center gap-2 cursor-pointer" onclick="showModule('dashboard')">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-sm">
          <i class="fas fa-bolt text-white text-sm"></i>
        </div>
        <span class="text-lg font-extrabold text-slate-900 tracking-tight">Work Volt</span>
      </div>

      <!-- Search (desktop) -->
      <div class="flex-1 max-w-sm mx-4 hidden md:block">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="global-search" placeholder="Search..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
        </div>
      </div>

      <div class="ml-auto flex items-center gap-1">

        <!-- Notifications -->
        <div class="relative">
          <button onclick="toggleNotificationDropdown()" class="relative p-2 hover:bg-slate-100 rounded-lg transition-colors">
            <i class="fas fa-bell text-slate-600 text-lg"></i>
            <span id="notif-badge" class="hidden absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
          </button>

          <!-- Notification Dropdown -->
          <div id="notification-dropdown" class="hidden bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col" style="max-height:80vh;">
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50 flex-shrink-0">
              <h3 class="font-semibold text-slate-900 text-sm">Notifications</h3>
              <div class="flex gap-3 items-center">
                <button onclick="markAllNotificationsRead()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold">Mark all read</button>
                <button onclick="toggleNotificationDropdown()" class="text-slate-400 hover:text-slate-600">
                  <i class="fas fa-times text-sm"></i>
                </button>
              </div>
            </div>
            <div id="notification-list" class="overflow-y-auto thin-scroll flex-1">
              <div class="p-8 text-center text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-2xl mb-3"></i>
                <p class="text-sm">Loading notifications...</p>
              </div>
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 text-center flex-shrink-0">
              <button onclick="showModule('notifications'); toggleNotificationDropdown();" class="text-xs text-blue-600 hover:text-blue-800 font-semibold">
                View all notifications →
              </button>
            </div>
          </div>
        </div>

        <!-- User menu -->
        <div class="relative" id="user-menu-container">
          <button onclick="toggleUserMenu(event)" class="flex items-center gap-2 pl-3 border-l border-slate-200 hover:bg-slate-100 rounded-lg p-2 transition-colors ml-1">
            <div id="user-avatar" class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-sm">JD</div>
            <span id="user-name" class="hidden md:block text-sm font-semibold text-slate-700">John Doe</span>
            <i class="fas fa-chevron-down text-xs text-slate-400"></i>
          </button>

          <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-52 bg-white rounded-xl shadow-xl border border-slate-200 z-50 overflow-hidden">
            <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50">
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Account</p>
            </div>
            <button onclick="openProfileModal(); closeUserMenu();" class="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i class="fas fa-user-circle text-slate-400 w-4"></i>My Profile
            </button>
            <button onclick="openSecurityModal(); closeUserMenu();" class="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
              <i class="fas fa-shield-alt text-slate-400 w-4"></i>Security & Password
            </button>
            <div class="border-t border-slate-100"></div>
            <button onclick="handleLogout()" class="w-full px-4 py-2.5 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-2.5 transition-colors">
              <i class="fas fa-sign-out-alt text-red-400 w-4"></i>Logout
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- Body: Sidebar + Main -->
    <div class="flex flex-1 overflow-hidden">

      <!-- Mobile sidebar overlay -->
      <div id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col lg:translate-x-0">
        <nav class="flex-1 overflow-y-auto thin-scroll p-3 space-y-0.5" id="nav-menu">
          <!-- Populated by renderNav() -->
        </nav>
        <div class="p-4 border-t border-slate-100">
          <p class="text-[10px] text-slate-400 text-center font-medium">Work Volt · v2.0</p>
        </div>
      </aside>

      <!-- Main content area — pages load here -->
      <main class="flex-1 overflow-y-auto bg-slate-50" id="main-content">
        <!-- Page modules injected here -->
      </main>

    </div>
  </div>


  <!-- ══════════════════════════════════════════
       GLOBAL MODALS MOUNT POINT
  ══════════════════════════════════════════ -->
  <div id="modals-root"></div>


  <!-- ══════════════════════════════════════════
       TOAST NOTIFICATIONS
  ══════════════════════════════════════════ -->
  <div id="toast-container"></div>


  <!-- ══════════════════════════════════════════
       GLOBAL LOADING OVERLAY
  ══════════════════════════════════════════ -->
  <div id="global-loading" class="hidden fixed inset-0 bg-white/70 z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="flex flex-col items-center gap-3">
      <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600"></i>
      <p class="text-slate-600 text-sm font-medium">Loading...</p>
    </div>
  </div>


  <!-- ══════════════════════════════════════════
       CORE JAVASCRIPT
  ══════════════════════════════════════════ -->
  <script>
  // ─────────────────────────────────────────────
  //  CONFIG & STATE
  // ─────────────────────────────────────────────
  let API_URL      = ''; // Will be set when Google Sheet is connected
  let currentUser  = {
    user_id:    'cf49fbed-2be7-4e55-95c0-742348fdcfe7',
    name:       'Super Admin',
    email:      'admin@workvolt.app',
    role:       'SuperAdmin',
    department: 'System Administrator',
    job_title:  'System Administrator',
    active:     true,
  };
  let currentToken = 'demo-token';
  let _setupData   = {};
  let _notifPollTimer = null;

  // Module → allowed roles
  // Core permanent modules (always in sidebar)
  const MODULE_ROLES = {
    dashboard:  ['SuperAdmin','Admin','Manager','Employee','Contractor'],
    settings:   ['SuperAdmin','Admin'],
    store:      ['SuperAdmin','Admin'],
  };

  const MODULE_ICONS = {
    dashboard:  'fa-th-large',
    settings:   'fa-cog',
    store:      'fa-store',
  };

  const MODULE_LABELS = {
    dashboard:  'Dashboard',
    settings:   'Settings',
    store:      'Module Store',
  };

  // Add-on modules available in the Store
  // These are registered here so the app knows how to render them once installed
  const ADDON_CATALOGUE = {
    tasks:       { label: 'Tasks',                icon: 'fa-check-circle',      roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    pipeline:    { label: 'Pipeline',             icon: 'fa-users',             roles: ['SuperAdmin','Admin','Manager'] },
    payroll:     { label: 'Payroll',              icon: 'fa-money-bill-wave',   roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    timesheets:  { label: 'Timesheets',           icon: 'fa-clock',             roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    financials:  { label: 'Financials',           icon: 'fa-chart-line',        roles: ['SuperAdmin','Admin','Manager'] },
    crm:         { label: 'CRM',                  icon: 'fa-address-book',      roles: ['SuperAdmin','Admin','Manager'] },
    projects:    { label: 'Projects',             icon: 'fa-folder-open',       roles: ['SuperAdmin','Admin','Manager'] },
    reports:     { label: 'Reports',              icon: 'fa-chart-pie',         roles: ['SuperAdmin','Admin','Manager'] },
    assets:      { label: 'Assets',               icon: 'fa-box-open',          roles: ['SuperAdmin','Admin','Manager','Employee'] },
    attendance:  { label: 'Attendance Tracker',   icon: 'fa-calendar-check',    roles: ['SuperAdmin','Admin','Manager','Employee'] },
    invoices:    { label: 'Invoice Manager',      icon: 'fa-file-invoice-dollar',roles: ['SuperAdmin','Admin','Manager'] },
    inventory:   { label: 'Inventory Control',    icon: 'fa-warehouse',         roles: ['SuperAdmin','Admin','Manager'] },
    scheduler:   { label: 'Shift Scheduler',      icon: 'fa-calendar-alt',      roles: ['SuperAdmin','Admin','Manager'] },
    expenses:    { label: 'Expense Claims',       icon: 'fa-receipt',           roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    contracts:   { label: 'Contract Hub',         icon: 'fa-file-signature',    roles: ['SuperAdmin','Admin','Manager'] },
    helpdesk:    { label: 'Help Desk',            icon: 'fa-headset',           roles: ['SuperAdmin','Admin','Manager','Employee'] },
    recruitment: { label: 'Recruitment Pipeline', icon: 'fa-user-tie',          roles: ['SuperAdmin','Admin','Manager'] },
  };

  // ── Active modules config ────────────────────────────────────────────
  // Admin controls which add-on modules are active for ALL users here.
  // When Google Sheet is connected, replace INSTALLED_MODULES by calling:
  //   apiCall('config/modules')  then reassign and call renderNav().
  //
  // To toggle a module on: uncomment its line below.
  // ───────────────────────────────────────────────────────────────────
  let INSTALLED_MODULES = [];
  window.INSTALLED_MODULES = INSTALLED_MODULES;


  // Saves active modules — swap for apiCall('config/save-modules') when Sheet is ready.
  // Until then, changes are in-memory only (all users see whatever is uncommented above).
  function saveInstalledModules() {
    // TODO: await apiCall('config/save-modules', { modules: JSON.stringify(INSTALLED_MODULES) });
  }

  // Loads installed modules — from GAS if connected, else uses in-memory list
  async function loadInstalledModules() {
    const savedUrl    = localStorage.getItem('wv_gas_url')    || '';
    const savedSecret = localStorage.getItem('wv_api_secret') || '';

    // Restore connection into global state
    if (savedUrl)    { API_URL = savedUrl;  window.API_URL = savedUrl; }
    if (savedSecret) { window.API_SECRET_CLIENT = savedSecret; }

    if (!savedUrl || !savedSecret) return; // not connected yet

    try {
      const url = new URL(savedUrl);
      url.searchParams.set('path',  'config/modules');
      url.searchParams.set('token', savedSecret);
      const res  = await fetch(url.toString(), { cache: 'no-cache' });
      const data = await res.json();
      if (data.modules) {
        INSTALLED_MODULES = data.modules;
        window.INSTALLED_MODULES = INSTALLED_MODULES;
      }    } catch(e) {
      console.warn('Could not load modules from Sheet:', e.message);
    }
  }


  // ─────────────────────────────────────────────
  //  API HELPER
  // ─────────────────────────────────────────────
  async function apiCall(path, params = {}, retries = 2) {
    const url = new URL(API_URL);
    url.searchParams.set('path', path);
    if (currentToken) url.searchParams.set('token', currentToken);
    for (const k in params) {
      if (params[k] !== undefined && params[k] !== null)
        url.searchParams.set(k, params[k]);
    }

    let lastErr;
    for (let i = 0; i <= retries; i++) {
      try {
        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 15000);
        const res  = await fetch(url.toString(), { method:'GET', mode:'cors', cache:'no-cache', signal: ctrl.signal });
        clearTimeout(tid);

        if (res.status === 401 || res.status === 403) throw new Error('TOKEN_INVALID');
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const text = await res.text();
        if (!text) throw new Error('Empty response');
        const data = JSON.parse(text);

        if (data.error) {
          if (data.code === 'TOKEN_INVALID' || data.error === 'TOKEN_INVALID') throw new Error('TOKEN_INVALID');
          throw new Error(data.error);
        }
        return data;

      } catch(err) {
        lastErr = err;
        if (err.name === 'AbortError') lastErr = new Error('Request timeout — please try again');
        else if (err.message === 'TOKEN_INVALID' && path !== 'auth/login') {
          forceLogout('Session expired. Please sign in again.');
          throw new Error('Session expired');
        }
        if (i < retries) await new Promise(r => setTimeout(r, 800 * (i + 1)));
      }
    }
    throw lastErr || new Error('Network error — please refresh');
  }


  // ─────────────────────────────────────────────
  //  SPLASH HELPERS
  // ─────────────────────────────────────────────
  function hideSplash() {
    const s = document.getElementById('splash-screen');
    s.classList.add('hidden');
    setTimeout(() => s.style.display = 'none', 450);
  }

  // ─── Connect / Setup / Login screens removed — added later ───


  function handleLogout() {
    forceLogout();
  }

  function forceLogout(msg) {
    currentToken = 'demo-token';
    currentUser  = {
      user_id:    'cf49fbed-2be7-4e55-95c0-742348fdcfe7',
      name:       'Super Admin',
      email:      'admin@workvolt.app',
      role:       'SuperAdmin',
      department: 'System Administrator',
      job_title:  'System Administrator',
      active:     true,
    };
    stopNotificationPolling();
    document.getElementById('app-screen').classList.add('hidden');
    if (msg) showToast(msg, 'error');
    // Login screen will be added later — for now just reload
    location.reload();
  }


  // ─────────────────────────────────────────────
  //  APP SHELL
  // ─────────────────────────────────────────────
  async function showApp() {
    hideSplash();
    document.getElementById('app-screen').classList.remove('hidden');

    // Set header user info
    const name   = currentUser?.name || 'User';
    const initials = name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('user-name').textContent   = name;
    document.getElementById('user-avatar').textContent = initials;

    renderNav();

    const lastModule = sessionStorage.getItem('lastModule') || 'dashboard';
    history.replaceState({ module: lastModule }, '', '#' + lastModule);
    showModule(lastModule, false);
    startNotificationPolling();
    updateBackButton();
  }

  // Build sidebar nav from user role
  function renderNav() {
    const nav  = document.getElementById('nav-menu');
    const role = currentUser?.role || 'Employee';

    // ── Permanent core entries: Dashboard ──
    const dashLink = `
      <a href="#dashboard" onclick="showModule('dashboard'); return false;"
         class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium transition-colors"
         data-module="dashboard">
        <i class="fas fa-th-large w-4 text-slate-400"></i>
        <span>Dashboard</span>
      </a>`;

    // ── Installed add-on modules (from INSTALLED_MODULES + ADDON_CATALOGUE) ──
    const addons = INSTALLED_MODULES.filter(m => {
      const def = ADDON_CATALOGUE[m.id];
      return def && def.roles.includes(role);
    });

    const addonLinks = addons.length ? `
      <div class="px-3 pt-4 pb-1">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Modules</p>
      </div>
      ${addons.map(m => {
        const def = ADDON_CATALOGUE[m.id] || {};
        return `
          <a href="#${m.id}" onclick="showModule('${m.id}'); return false;"
             class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium transition-colors"
             data-module="${m.id}">
            <i class="fas ${def.icon || m.icon} w-4 text-slate-400"></i>
            <span>${def.label || m.label}</span>
          </a>`;
      }).join('')}
    ` : '';

    // ── Bottom: Settings + Store ──
    const bottomLinks = `
      <div class="border-t border-slate-100 mt-2 pt-2 space-y-0.5">
        ${MODULE_ROLES.settings.includes(role) ? `
        <a href="#settings" onclick="showModule('settings'); return false;"
           class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium transition-colors"
           data-module="settings">
          <i class="fas fa-cog w-4 text-slate-400"></i>
          <span>Settings</span>
        </a>` : ''}
        ${MODULE_ROLES.store.includes(role) ? `
        <a href="#store" onclick="showModule('store'); return false;"
           class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium transition-colors"
           data-module="store">
          <i class="fas fa-store w-4 text-slate-400"></i>
          <span>Module Store</span>
        </a>` : ''}
      </div>`;

    nav.innerHTML = dashLink + addonLinks + bottomLinks;
  }

  function showModule(name, push = true) {
    // Close mobile sidebar
    closeMobileSidebar();

    sessionStorage.setItem('lastModule', name);
    if (push) history.pushState({ module: name }, '', '#' + name);

    // Highlight active nav
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.module === name);
    });

    // Show loader placeholder
    const main = document.getElementById('main-content');
    main.innerHTML = `
      <div class="flex items-center justify-center h-64">
        <i class="fas fa-circle-notch fa-spin text-3xl text-blue-500 opacity-60"></i>
      </div>`;

    // Load the page module (each page is its own JS file)
    requestAnimationFrame(() => loadPage(name, main));

    updateBackButton();
  }

  // ── Page loader — each module lives in /pages/<name>.js ──
  // When you create a page module, it should expose window.WorkVoltPages[name](container)
  function loadPage(name, container) {
    if (window.WorkVoltPages && typeof window.WorkVoltPages[name] === 'function') {
      window.WorkVoltPages[name](container);
      return;
    }

    // Remove stale cached script so the module re-fetches cleanly on re-navigation
    const existing = document.querySelector(`script[data-page="${name}"]`);
    if (existing) existing.remove();

    const script = document.createElement('script');
    script.src          = `pages/${name}.js`;
    script.dataset.page = name;
    script.onload = () => {
      if (window.WorkVoltPages && typeof window.WorkVoltPages[name] === 'function') {
        window.WorkVoltPages[name](container);
      } else {
        renderPagePlaceholder(name, container);
      }
    };
    script.onerror = () => renderPagePlaceholder(name, container);
    document.head.appendChild(script);
  }

  function renderPagePlaceholder(name, container) {
    const label = MODULE_LABELS[name] || name;
    const icon  = MODULE_ICONS[name] || 'fa-layer-group';
    container.innerHTML = `
      <div class="p-6 md:p-8 fade-in">
        <div class="max-w-2xl mx-auto mt-16 text-center">
          <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-50 rounded-2xl mb-6">
            <i class="fas ${icon} text-blue-400 text-3xl"></i>
          </div>
          <h2 class="text-2xl font-extrabold text-slate-800 mb-2">${label}</h2>
          <p class="text-slate-500 mb-6 text-sm leading-relaxed">
            This page is ready to be built as its own module.<br>
            Create <code class="bg-slate-100 px-2 py-0.5 rounded text-blue-600 font-mono text-xs">pages/${name}.js</code> and register it with <code class="bg-slate-100 px-2 py-0.5 rounded text-blue-600 font-mono text-xs">WorkVoltPages.${name}</code>.
          </p>
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 text-left font-mono text-xs text-slate-600 overflow-x-auto">
            <span class="text-slate-400">// pages/${name}.js</span><br>
            window.WorkVoltPages = window.WorkVoltPages || {};<br><br>
            window.WorkVoltPages['${name}'] = function(container) {<br>
            &nbsp;&nbsp;container.innerHTML = '<span class="text-green-600">&lt;!-- your UI here --&gt;</span>';<br>
            };
          </div>
        </div>
      </div>`;
  }

  // Browser back/forward
  window.addEventListener('popstate', e => {
    const mod = e.state?.module || 'dashboard';
    showModule(mod, false);
  });

  function updateBackButton() {
    document.getElementById('app-back-btn').classList.toggle('hidden', history.length <= 1);
  }

  function appGoBack() {
    history.back();
  }


  // ─────────────────────────────────────────────
  //  NOTIFICATION SYSTEM (stub — connect to backend later)
  // ─────────────────────────────────────────────
  function toggleNotificationDropdown() {
    const dd = document.getElementById('notification-dropdown');
    dd.classList.toggle('hidden');
    if (!dd.classList.contains('hidden')) loadNotifications();
  }

  function closeNotificationDropdown() {
    document.getElementById('notification-dropdown').classList.add('hidden');
  }

  function loadNotifications() {
    // Stub — replace with apiCall('notifications/list') when backend ready
    const list = document.getElementById('notification-list');
    list.innerHTML = `
      <div class="p-8 text-center text-slate-400">
        <i class="fas fa-bell-slash text-2xl mb-3 opacity-40"></i>
        <p class="text-sm">No notifications yet</p>
      </div>`;
  }

  function markAllNotificationsRead() {
    document.getElementById('notif-badge').classList.add('hidden');
    showToast('All notifications marked as read', 'success');
    closeNotificationDropdown();
  }

  function startNotificationPolling() {
    // Poll every 60s — replace with actual apiCall when backend ready
    _notifPollTimer = setInterval(() => {
      // apiCall('notifications/list').then(data => renderNotifBadge(data))
    }, 60000);
  }

  function stopNotificationPolling() {
    if (_notifPollTimer) { clearInterval(_notifPollTimer); _notifPollTimer = null; }
  }


  // ─────────────────────────────────────────────
  //  USER MENU
  // ─────────────────────────────────────────────
  function toggleUserMenu(e) {
    e?.stopPropagation();
    document.getElementById('user-dropdown').classList.toggle('hidden');
  }

  function closeUserMenu() {
    document.getElementById('user-dropdown').classList.add('hidden');
  }

  function openProfileModal()  { showToast('Profile modal — coming soon', 'info'); }
  function openSecurityModal() { showToast('Security modal — coming soon', 'info'); }


  // ─────────────────────────────────────────────
  //  MOBILE SIDEBAR
  // ─────────────────────────────────────────────
  function toggleMobileSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('visible');
  }
  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('visible');
  }


  // ─────────────────────────────────────────────
  //  TOAST
  // ─────────────────────────────────────────────
  function showToast(msg, type = 'info', duration = 3500) {
    const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle', warning:'fa-triangle-exclamation' };
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'toastOut .3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }


  // ─────────────────────────────────────────────
  //  CLOSE DROPDOWNS ON OUTSIDE CLICK
  // ─────────────────────────────────────────────
  document.addEventListener('click', e => {
    if (!document.getElementById('user-menu-container')?.contains(e.target))
      closeUserMenu();
    if (!document.getElementById('notification-dropdown')?.contains(e.target)
        && !e.target.closest('button[onclick*="toggleNotificationDropdown"]'))
      closeNotificationDropdown();
  });


  // Expose globals early so page modules can access them immediately on load
  window.WorkVolt = {
    api: apiCall,
    user: () => currentUser,
    token: () => currentToken,
    toast: showToast,
    navigate: showModule,
  };
  window.WorkVoltPages = window.WorkVoltPages || {};
  window.renderNav = renderNav;

  // ─────────────────────────────────────────────
  //  BOOT SEQUENCE
  // ─────────────────────────────────────────────
  window.addEventListener('load', async () => {
    // Go straight to app — login & Google Sheet will be connected later
    await loadInstalledModules(); // no-op until Sheet connected; swaps for apiCall later
    hideSplash();
    await showApp();
  });

  // window.WorkVolt globals are defined above near the boot sequence
  </script>

</body>
</html>
