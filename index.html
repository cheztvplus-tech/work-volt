<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Volt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; }
    .login-screen { min-height: 100vh; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .login-card { background: white; border-radius: 1rem; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .field { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1rem; outline: none; transition: border-color 0.2s; }
    .field:focus { border-color: #3b82f6; }
    .btn-primary { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; }
    .hidden { display: none !important; }
    #app-screen { display: none; min-height: 100vh; }
    .app-header { background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .app-main { padding: 2rem; }
  </style>
</head>
<body>

  <!-- LOGIN / SETUP SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <!-- Dynamic content loaded here -->
      <div id="login-content"></div>
    </div>
  </div>

  <!-- MAIN APP (shown after login) -->
  <div id="app-screen">
    <div class="app-header">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 2rem; height: 2rem; background: #2563eb; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; color: white;">
          <i class="fas fa-bolt"></i>
        </div>
        <span style="font-weight: 700; color: #1e293b;">Work Volt</span>
      </div>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="user-display" style="color: #64748b; font-size: 0.875rem;"></span>
        <button onclick="logout()" style="padding: 0.5rem 1rem; background: #f1f5f9; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem;">Logout</button>
      </div>
    </div>
    <div class="app-main">
      <h1 style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem;">Dashboard</h1>
      <p style="color: #64748b;">Welcome to Work Volt! You are logged in as <span id="role-display" style="font-weight: 600;"></span>.</p>
      <!-- Your app content goes here -->
    </div>
  </div>

  <script>
    // ==========================================
    //  CONFIG - ONLY THING USER NEEDS TO ENTER
    // ==========================================
    let API_URL = localStorage.getItem('wv_api_url') || '';
    
    // ==========================================
    //  STATE
    // ==========================================
    let currentUser = null;
    let sessionId = localStorage.getItem('wv_session') || null;

    // ==========================================
    //  API CALLS
    // ==========================================
    async function api(path, params = {}) {
      if (!API_URL) throw new Error('No API URL set');
      
      const url = new URL(API_URL);
      url.searchParams.set('path', path);
      url.searchParams.set('_t', Date.now());
      
      Object.keys(params).forEach(k => {
        if (params[k] !== undefined) url.searchParams.set(k, params[k]);
      });
      
      if (sessionId) url.searchParams.set('session', sessionId);
      
      const res = await fetch(url.toString());
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    // ==========================================
    //  INIT - Check setup status on load
    // ==========================================
    async function init() {
      // If we have saved URL, check if we're already logged in
      if (API_URL && sessionId) {
        try {
          const check = await api('check-session');
          if (check.valid !== false) {
            showApp();
            return;
          }
        } catch(e) {
          // Session invalid, clear it
          sessionId = null;
          localStorage.removeItem('wv_session');
        }
      }
      
      showLoginScreen();
    }

    function showLoginScreen() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('app-screen').style.display = 'none';
      
      // If no API URL set, show URL input first
      if (!API_URL) {
        renderUrlInput();
        return;
      }
      
      // Check if setup needed
      checkSetup();
    }

    // ==========================================
    //  URL INPUT (First step)
    // ==========================================
    function renderUrlInput() {
      document.getElementById('login-content').innerHTML = `
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <div style="width: 4rem; height: 4rem; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: white; font-size: 1.5rem;">
            <i class="fas fa-bolt"></i>
          </div>
          <h1 style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem;">Work Volt</h1>
          <p style="color: #64748b; font-size: 0.875rem;">Enter your Google Apps Script URL to connect</p>
        </div>
        <input type="url" id="api-url" class="field" placeholder="https://script.google.com/macros/s/.../exec" value="">
        <button onclick="saveUrl()" class="btn-primary">Connect</button>
      `;
    }

    function saveUrl() {
      const url = document.getElementById('api-url').value.trim();
      if (!url || !url.includes('script.google.com')) {
        alert('Please enter a valid Google Apps Script URL');
        return;
      }
      API_URL = url;
      localStorage.setItem('wv_api_url', url);
      checkSetup();
    }

    // ==========================================
    //  CHECK SETUP STATUS
    // ==========================================
    async function checkSetup() {
      try {
        const status = await api('check-setup');
        
        if (status.needsSetup) {
          renderSetupForm();
        } else {
          renderLoginForm();
        }
      } catch(e) {
        document.getElementById('login-content').innerHTML = `
          <div class="error">Error connecting to server: ${e.message}</div>
          <button onclick="renderUrlInput()" class="btn-primary">Change URL</button>
        `;
      }
    }

    // ==========================================
    //  SETUP FORM (Create first admin)
    // ==========================================
    function renderSetupForm() {
      document.getElementById('login-content').innerHTML = `
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <div style="width: 4rem; height: 4rem; background: #10b981; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: white; font-size: 1.5rem;">
            <i class="fas fa-user-plus"></i>
          </div>
          <h1 style="font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem;">Create Admin Account</h1>
          <p style="color: #64748b; font-size: 0.875rem;">This is the first setup. Create your administrator account.</p>
        </div>
        <div id="setup-error" class="error hidden"></div>
        <input type="text" id="setup-name" class="field" placeholder="Full Name">
        <input type="email" id="setup-email" class="field" placeholder="Email Address">
        <input type="password" id="setup-password" class="field" placeholder="Password">
        <input type="password" id="setup-confirm" class="field" placeholder="Confirm Password">
        <button onclick="createAdmin()" class="btn-primary">Create Admin & Login</button>
        <button onclick="localStorage.removeItem('wv_api_url'); location.reload();" style="width: 100%; margin-top: 0.5rem; padding: 0.5rem; background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 0.875rem;">Change URL</button>
      `;
    }

    async function createAdmin() {
      const name = document.getElementById('setup-name').value.trim();
      const email = document.getElementById('setup-email').value.trim();
      const password = document.getElementById('setup-password').value;
      const confirm = document.getElementById('setup-confirm').value;
      const errorEl = document.getElementById('setup-error');
      
      errorEl.classList.add('hidden');
      
      if (!name || !email || !password) {
        errorEl.textContent = 'Please fill in all fields';
        errorEl.classList.remove('hidden');
        return;
      }
      
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.classList.remove('hidden');
        return;
      }
      
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters';
        errorEl.classList.remove('hidden');
        return;
      }
      
      try {
        const btn = document.querySelector('.btn-primary');
        btn.disabled = true;
        btn.textContent = 'Creating...';
        
        const result = await api('create-first-admin', { name, email, password });
        
        // Save session
        sessionId = result.session;
        currentUser = result.user;
        localStorage.setItem('wv_session', sessionId);
        
        showApp();
        
      } catch(e) {
        errorEl.textContent = e.message;
        errorEl.classList.remove('hidden');
        document.querySelector('.btn-primary').disabled = false;
        document.querySelector('.btn-primary').textContent = 'Create Admin & Login';
      }
    }

    // ==========================================
    //  LOGIN FORM
    // ==========================================
    function renderLoginForm() {
      document.getElementById('login-content').innerHTML = `
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <div style="width: 4rem; height: 4rem; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: white; font-size: 1.5rem;">
            <i class="fas fa-bolt"></i>
          </div>
          <h1 style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p style="color: #64748b; font-size: 0.875rem;">Sign in to your account</p>
        </div>
        <div id="login-error" class="error hidden"></div>
        <input type="email" id="login-email" class="field" placeholder="Email Address">
        <input type="password" id="login-password" class="field" placeholder="Password">
        <button onclick="doLogin()" class="btn-primary">Sign In</button>
        <button onclick="localStorage.removeItem('wv_api_url'); location.reload();" style="width: 100%; margin-top: 0.5rem; padding: 0.5rem; background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 0.875rem;">Change URL</button>
      `;
    }

    async function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      
      errorEl.classList.add('hidden');
      
      if (!email || !password) {
        errorEl.textContent = 'Please enter email and password';
        errorEl.classList.remove('hidden');
        return;
      }
      
      try {
        const btn = document.querySelector('.btn-primary');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        
        const result = await api('login', { email, password });
        
        // Save session
        sessionId = result.session;
        currentUser = result.user;
        localStorage.setItem('wv_session', sessionId);
        
        showApp();
        
      } catch(e) {
        errorEl.textContent = e.message;
        errorEl.classList.remove('hidden');
        document.querySelector('.btn-primary').disabled = false;
        document.querySelector('.btn-primary').textContent = 'Sign In';
      }
    }

    // ==========================================
    //  SHOW APP
    // ==========================================
    async function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').style.display = 'block';
      
      // Get fresh user data
      try {
        const result = await api('get-user');
        currentUser = result.user;
      } catch(e) {
        // If can't get user, logout
        logout();
        return;
      }
      
      document.getElementById('user-display').textContent = currentUser.name || currentUser.email;
      document.getElementById('role-display').textContent = currentUser.role;
    }

    // ==========================================
    //  LOGOUT
    // ==========================================
    async function logout() {
      try {
        await api('logout');
      } catch(e) {
        // Ignore errors
      }
      
      sessionId = null;
      currentUser = null;
      localStorage.removeItem('wv_session');
      
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('login-screen').classList.remove('hidden');
      renderLoginForm();
    }

    // ==========================================
    //  START
    // ==========================================
    window.onload = init;
  </script>

</body>
</html>
