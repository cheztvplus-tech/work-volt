<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Volt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ─── Base ─── */
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }

    /* ─── Transitions ─── */
    .fade-in  { animation: fadeIn 0.25s ease both; }
    .slide-up { animation: slideUp 0.3s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    /* ─── Splash ─── */
    #splash-screen { transition: opacity 0.4s ease, visibility 0.4s ease; }
    #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ─── Splash bolt pulse ─── */
    .bolt-pulse { animation: boltPulse 2s ease-in-out infinite; }
    @keyframes boltPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.85} }

    /* ─── Nav item active ─── */
    .nav-item { transition: background 0.15s, color 0.15s; }
    .nav-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .nav-item.active i { color: #2563eb; }

    /* ─── Notification dropdown ─── */
    #notification-dropdown {
      position: fixed;
      right: 0.5rem; left: 0.5rem;
      top: 4rem;
      max-height: 80vh;
      z-index: 60;
    }
    @media (min-width: 640px) {
      #notification-dropdown {
        position: absolute;
        right: 0; left: auto;
        top: auto; margin-top: 0.5rem;
        width: 22rem;
      }
    }

    /* ─── Kanban scrollbar ─── */
    .kanban-scroll::-webkit-scrollbar { height: 6px; }
    .kanban-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .kanban-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* ─── Card hover ─── */
    .card-hover { transition: transform 0.18s, box-shadow 0.18s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 28px -6px rgba(0,0,0,.12); }

    /* ─── Sortable ghost ─── */
    .sortable-ghost { opacity: 0.35; background: #e2e8f0; border: 2px dashed #94a3b8; }

    /* ─── Chart container ─── */
    .chart-container { position: relative; height: 250px; width: 100%; }
    .chart-container canvas { max-height: 250px !important; width: 100% !important; }

    /* ─── Modal blur overlay ─── */
    .modal-overlay { backdrop-filter: blur(4px); }

    /* ─── Skeleton loader ─── */
    .skeleton {
      background: linear-gradient(90deg, #f0f4f8 25%, #e2e8f0 50%, #f0f4f8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ─── Input focus ring ─── */
    .field { width:100%; padding:.6rem .875rem; border:1.5px solid #e2e8f0; border-radius:10px; font-size:.875rem; outline:none; transition:border-color .15s, box-shadow .15s; font-family:inherit; }
    .field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .field::placeholder { color:#94a3b8; }

    /* ─── Btn primary ─── */
    .btn-primary { display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.65rem 1.25rem; background:#2563eb; color:#fff; border:none; border-radius:10px; font-size:.875rem; font-weight:600; cursor:pointer; transition:background .15s, transform .1s; font-family:inherit; }
    .btn-primary:hover { background:#1d4ed8; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; }

    /* ─── Btn secondary ─── */
    .btn-secondary { display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.65rem 1.25rem; background:#f1f5f9; color:#475569; border:none; border-radius:10px; font-size:.875rem; font-weight:600; cursor:pointer; transition:background .15s; font-family:inherit; }
    .btn-secondary:hover { background:#e2e8f0; }

    /* ─── Toast ─── */
    #toast-container { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; display:flex; flex-direction:column; gap:.5rem; pointer-events:none; }
    .toast { display:flex; align-items:center; gap:.75rem; padding:.75rem 1.1rem; border-radius:12px; font-size:.875rem; font-weight:500; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.18); animation:toastIn .3s cubic-bezier(.16,1,.3,1); pointer-events:auto; max-width:360px; }
    .toast.success { background:#16a34a; }
    .toast.error   { background:#dc2626; }
    .toast.info    { background:#2563eb; }
    .toast.warning { background:#d97706; }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(12px)} }

    /* ─── Scrollbar thin ─── */
    .thin-scroll::-webkit-scrollbar { width:4px; }
    .thin-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }

    /* ─── Mobile sidebar overlay ─── */
    #sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
    #sidebar-overlay.visible { display:block; }

    /* ─── Collapsible sidebar (desktop) ─── */
    #sidebar { transition: width .22s cubic-bezier(.4,0,.2,1); }
    #sidebar.collapsed { width: 56px !important; }
    #sidebar.collapsed .nav-label,
    #sidebar.collapsed .nav-section-label,
    #sidebar.collapsed .sidebar-footer-text,
    #sidebar.collapsed .drag-hint { display: none !important; }
    #sidebar.collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
    #sidebar.collapsed .nav-item i.w-4 { margin: 0; }
    #sidebar.collapsed .nav-item i.fa-grip-vertical { display: none; }
    #sidebar.collapsed #nav-sortable .nav-sortable-item a { justify-content: center; padding-left:0; padding-right:0; }
    #sidebar.collapsed .sidebar-collapse-btn i { transform: rotate(180deg); }

    /* ─── Responsive mobile tweaks ─── */
    @media (max-width: 768px) {
      #sidebar { position:fixed; top:0; left:0; height:100vh; z-index:50; transform:translateX(-100%); transition:transform .25s ease; }
      #sidebar.open { transform:translateX(0); }
    }
    @media (max-width: 640px) {
      .chart-container { height: 200px; }
    }

    /* ─── Login Screen ─── */
    .login-screen { min-height: 100vh; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #1d4ed8 100%); }
    .login-card { background: white; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
  </style>
</head>

<body class="min-h-screen">

  <!-- ══════════════════════════════════════════
       SPLASH SCREEN

  <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800">

  <!-- ══════════════════════════════════════════
       GLOBAL MODALS MOUNT POINT
  ══════════════════════════════════════════ -->

  <!-- ══════════════════════════════════════════
       TOAST NOTIFICATIONS

  <!-- ══════════════════════════════════════════
       GLOBAL LOADING OVERLAY
  ══════════════════════════════════════════ -->

    <div class="flex flex-col items-center gap-3">
      <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600"></i>

  <!-- ══════════════════════════════════════════
       CORE JAVASCRIPT
  ══════════════════════════════════════════ -->
  <script>
// ─────────────────────────────────────────────
//  CONFIG & STATE
// ─────────────────────────────────────────────
let API_URL = '';
let currentUser = null;
let currentSession = null;

// Module → allowed roles
const MODULE_ROLES = {
  dashboard:  ['SuperAdmin','Admin','Manager','Employee','Contractor'],
  settings:   ['SuperAdmin','Admin'],
  store:      ['SuperAdmin','Admin'],
  roles:      ['SuperAdmin','Admin'],
};

const MODULE_ICONS = {
  dashboard:  'fa-th-large',
  settings:   'fa-cog',
  store:      'fa-store',
  roles:      'fa-shield-alt',
};

const MODULE_LABELS = {
  dashboard:  'Dashboard',
  settings:   'Settings',
  store:      'Module Store',
  roles:      'Role Permissions',
};

// Live role-permission overrides loaded from config sheet.
let _rolePermissions   = {};
let _userModuleOverrides = {};

// ─────────────────────────────────────────────
//  LOGIN SYSTEM - SIMPLE SESSION BASED
// ─────────────────────────────────────────────

async function checkLoginState() {
  const savedUrl = localStorage.getItem('wv_gas_url') || '';
  const savedSession = localStorage.getItem('wv_session');
  const savedUser = localStorage.getItem('wv_user');
  
  // Check for URL params (shared link)
  const urlParams = new URLSearchParams(window.location.search);
  const sharedUrl = urlParams.get('gas_url');
  
  if (sharedUrl) {
    localStorage.setItem('wv_gas_url', sharedUrl);
    API_URL = sharedUrl;
    window.history.replaceState({}, document.title, window.location.pathname);
    return checkSystemState();
  }
  
  if (!savedUrl) {
    return { state: 'no-connection' };
  }
  
  API_URL = savedUrl;
  
  // Check for valid session
  if (savedSession && savedUser) {
    try {
      const check = await apiCall('auth/check-session', { session_id: savedSession }, 1, true);
      if (check.valid) {
        currentUser = JSON.parse(savedUser);
        currentSession = savedSession;
        return { state: 'authenticated' };
      }
    } catch (e) {
      clearAuthData();
    }
  }
  
  // Check if system needs first admin
  return checkSystemState();
}

async function checkSystemState() {
  try {
    // Try to list users - if no admin exists, we need setup
    const data = await apiCall('users/list', {}, 1, true);
    const hasAdmin = (data.rows || []).some(u => u.role === 'SuperAdmin' || u.role === 'Admin');
    
    if (!hasAdmin) {
      return { state: 'needs-first-admin' };
    }
  } catch (e) {
    // If we can't reach server, treat as needs setup
    return { state: 'needs-first-admin' };
  }
  
  return { state: 'login' };
}

async function performLogin(email, password) {
  // Hash password
  const msgBuffer = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  
  // PUBLIC LOGIN - no API_SECRET needed!
  const data = await apiCall('auth/public-login', {
    email: email,
    password_hash: hashHex
  }, 2, true);
  
  if (data.error) throw new Error(data.error);
  if (!data.success || !data.user) throw new Error('Login failed');
  
  // Save session
  localStorage.setItem('wv_user', JSON.stringify(data.user));
  localStorage.setItem('wv_session', data.session_id);
  
  currentUser = data.user;
  currentSession = data.session_id;
  
  return data;
}

// ─────────────────────────────────────────────
//  API HELPER - SESSION BASED
// ─────────────────────────────────────────────
async function apiCall(path, params = {}, retries = 2, allowNoSession = false) {
  if (!API_URL) throw new Error('Not connected');
  
  const url = new URL(API_URL);
  url.searchParams.set('path', path);
  url.searchParams.set('_t', Date.now().toString());
  
  // Use session for auth
  if (currentSession && !allowNoSession) {
    url.searchParams.set('session_id', currentSession);
  }
  // Only use API_SECRET for setup operations (passed as param for first admin)
  else if (params._api_secret) {
    url.searchParams.set('token', params._api_secret);
    delete params._api_secret; // Remove so it doesn't go in URL twice
  }
  
  for (const k in params) {
    if (params[k] !== undefined && params[k] !== null) {
      url.searchParams.set(k, params[k]);
    }
  }

  let lastErr;
  for (let i = 0; i <= retries; i++) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 15000);
      
      const res = await fetch(url.toString(), { 
        method: 'GET', 
        mode: 'cors', 
        cache: 'no-cache',
        signal: ctrl.signal 
      });
      
      clearTimeout(tid);

      if (res.status === 401 || res.status === 403) {
        if (!allowNoSession) {
          forceLogout('Session expired. Please sign in again.');
          throw new Error('Session expired');
        }
      }
      
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const text = await res.text();
      if (!text) throw new Error('Empty response');
      
      const data = JSON.parse(text);
      if (data.error) throw new Error(data.error);
      
      return data;

    } catch(err) {
      lastErr = err;
      if (err.name === 'AbortError') lastErr = new Error('Request timeout');
      if (i < retries) await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
  throw lastErr || new Error('Network error');
}

function clearAuthData() {
  localStorage.removeItem('wv_user');
  localStorage.removeItem('wv_session');
  currentUser = null;
  currentSession = null;
}

function forceLogout(msg) {
  clearAuthData();
  stopNotificationPolling();
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  if (msg) showToast(msg, 'error');
  
  checkLoginState().then(state => {
    renderLoginState(state);
  });
}

window.handleLogout = function() {
  if (currentSession) {
    const url = new URL(API_URL);
    url.searchParams.set('path', 'auth/invalidate-session');
    url.searchParams.set('session_id', currentSession);
    fetch(url.toString()).catch(() => {});
  }
  
  clearAuthData();
  stopNotificationPolling();
  
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('main-content').innerHTML = '';
  
  checkLoginState().then(state => {
    renderLoginState(state);
  });
  
  showToast('Logged out successfully', 'info');
};

function renderLoginState(state) {
  const container = document.getElementById('login-card-content');
  
  switch (state.state) {
    case 'no-connection':
      container.innerHTML = renderNoConnectionCard();
      break;
    case 'needs-first-admin':
      container.innerHTML = renderFirstAdminCard();
      break;
    case 'login':
      container.innerHTML = renderLoginCard();
      break;
    case 'authenticated':
      showApp();
      return;
  }
}

function renderNoConnectionCard() {
  return `

window.createFirstAdmin = async function() {
  const email = document.getElementById('setup-email').value.trim();
  const name = document.getElementById('setup-name').value.trim();
  const password = document.getElementById('setup-password').value;
  const confirm = document.getElementById('setup-password-confirm').value;
  const apiSecret = document.getElementById('setup-api-secret').value.trim();
  const errorEl = document.getElementById('setup-error');
  
  errorEl.classList.add('hidden');
  
  if (!email || !name || !password || !apiSecret) {
    errorEl.textContent = 'Please fill in all fields including API Secret';
    errorEl.classList.remove('hidden');
    return;
  }
  if (password !== confirm) {
    errorEl.textContent = 'Passwords do not match';
    errorEl.classList.remove('hidden');
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = 'Password must be at least 6 characters';
    errorEl.classList.remove('hidden');
    return;
  }
  
  try {
    // Hash password
    const msgBuffer = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    
    // Create admin user using API_SECRET (setup operation only)
    const data = await apiCall('users/create', {
      email: email,
      password_hash: hashHex,
      role: 'Admin',
      name: name,
      _api_secret: apiSecret  // Pass secretly, not stored
    }, 2, true);
    
    if (data.error) throw new Error(data.error);
    
    // Auto-login using new session-based login
    await performLogin(email, password);
    
    // Success - show app
    hideSplash();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    await showApp();
    
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.classList.remove('hidden');
  }
};

  function _initNavDrag() {
    const sortable = document.getElementById('nav-sortable');
    if (!sortable) return;
    let dragEl = null;

    sortable.querySelectorAll('.nav-sortable-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragEl = item;
        setTimeout(() => { item.style.opacity = '0.4'; }, 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.style.opacity = '';
        dragEl = null;
        const order = Array.from(sortable.querySelectorAll('.nav-sortable-item')).map(el => el.dataset.moduleId);

      item.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragEl || dragEl === item) return;
        const rect = item.getBoundingClientRect();
        if (e.clientY < rect.top + rect.height / 2) {
          sortable.insertBefore(dragEl, item);
        } else {
          sortable.insertBefore(dragEl, item.nextSibling);
        }
      });
    });
  }

  // ─────────────────────────────────────────────

  const NOTIF_PRIORITY_BEHAVIOR = {

  const NOTIF_TYPE_CONFIG = {

  function isQuietHours() {
    try {
      const uid = currentUser?.user_id;
      const prefs = JSON.parse(localStorage.getItem('wv_notif_prefs_' + uid) || 'null');
      if (!prefs || !prefs.quiet_hours_start || !prefs.quiet_hours_end) return false;
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const [sh, sm] = prefs.quiet_hours_start.split(':').map(Number);
      const [eh, em] = prefs.quiet_hours_end.split(':').map(Number);
      const start = sh * 60 + sm;
      const end = eh * 60 + em;
      return start <= end ? (nowMin >= start && nowMin < end) : (nowMin >= start || nowMin < end);
    } catch(e) { return false; }
  }

  function showNotifPopup(notif) {
    if (isQuietHours()) return;
    const uid = currentUser?.user_id;

    if (prefs.popup_enabled === 'false') return;

    const tc = NOTIF_TYPE_CONFIG[notif.type] || NOTIF_TYPE_CONFIG.system;
    const isCritical = notif.priority === 'critical';
    const isHigh = notif.priority === 'high';

    if (isCritical && prefs.sound_enabled === 'true') {
      try {

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = isCritical ? 880 : 660;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch(e) {}
    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;top:1rem;right:1rem;z-index:99999;max-width:360px;width:100%;pointer-events:auto;animation:notifSlideIn .3s ease';
    wrap.innerHTML = `
      <div style="background:#fff;border-radius:1rem;box-shadow:0 12px 40px rgba(0,0,0,.18);border:1.5px solid #e2e8f0;overflow:hidden">
        ${isCritical ? `<div style="background:#ef4444;padding:.35rem .75rem;display:flex;align-items:center;gap:.5rem">
          <i class="fas fa-exclamation-triangle" style="color:#fff;font-size:.7rem"></i>
          <span style="color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase">Critical Alert</span>
        </div>` : ''}
        <div style="padding:.875rem 1rem;display:flex;align-items:flex-start;gap:.75rem">
          <div style="width:2.25rem;height:2.25rem;border-radius:.625rem;background:${tc.color}18;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <i class="fas ${tc.icon}" style="color:${tc.color};font-size:.9rem"></i>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem">
              <span style="font-size:.65rem;font-weight:700;background:${tc.color}18;color:${tc.color};padding:.1rem .5rem;border-radius:.25rem">${tc.label}</span>
            </div>
            <p style="font-size:.8rem;font-weight:700;color:#0f172a;line-height:1.3;margin:0">${notif.title || ''}</p>
            ${notif.body ? `<p style="font-size:.72rem;color:#64748b;margin:.2rem 0 0;line-height:1.4">${notif.body}</p>` : ''}
          </div>
          <button onclick="this.closest('[style]').remove()" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:.8rem;padding:.25rem;flex-shrink:0;line-height:1">✕</button>
        </div>
        ${notif.ref_type ? `
        <div style="padding:.5rem 1rem .75rem;display:flex;gap:.5rem">
          <button onclick="window.WorkVolt&&window.WorkVolt.navigate('${notif.ref_type}');this.closest('[style]').remove()" style="flex:1;padding:.4rem .75rem;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.5rem;font-size:.72rem;font-weight:600;color:#475569;cursor:pointer">
            View ${notif.ref_type} →
          </button>
          <button onclick="this.closest('[style]').remove();closeNotificationDropdown&&closeNotificationDropdown()" style="padding:.4rem .75rem;background:transparent;border:none;font-size:.72rem;color:#94a3b8;cursor:pointer">Dismiss</button>
        </div>` : ''}
      </div>`;

    if (!document.getElementById('notif-anim-style')) {
      const st = document.createElement('style');
      st.id = 'notif-anim-style';
      st.textContent = '@keyframes notifSlideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes notifSlideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}';
      document.head.appendChild(st);
    }

    document.body.appendChild(wrap);
    const dur = isCritical ? 8000 : isHigh ? 5000 : 4000;
    setTimeout(() => {
      wrap.style.animation = 'notifSlideOut .3s ease forwards';
      setTimeout(() => wrap.remove(), 300);
    }, dur);
  }

  function renderNotifDropdownItems(rows, unread) {
    const list = document.getElementById('notification-list');
    if (!list) return;

    if (!rows.length) {
      list.innerHTML = `
        <div class="p-8 text-center text-slate-400">
          <i class="fas fa-bell-slash text-2xl mb-3 opacity-40 block"></i>
          <p class="text-sm font-semibold">All caught up!</p>
          <p class="text-xs mt-1">No new notifications</p>
        </div>`;
      return;
    }

    list.innerHTML = rows.slice(0, 8).map(r => {
      const tc = NOTIF_TYPE_CONFIG[r.type] || NOTIF_TYPE_CONFIG.system;
      const isUnread = r.read !== 'true' && r.read !== true;
      const cnt = parseInt(r.group_count) || 1;
      const ago = (() => {
        const diff = Math.floor((Date.now() - new Date(r.created_at)) / 1000);
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff/60) + 'm ago';
        if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
        return Math.floor(diff/86400) + 'd ago';
      })();
      return `<div class="flex items-start gap-3 px-4 py-3 ${isUnread?'bg-blue-50/40':''} hover:bg-slate-50 cursor-pointer transition-colors border-b border-slate-100 last:border-0"
        data-dropdown-notif-id="${r.id}"
        onclick="handleDropdownNotifClick('${r.id}', '${r.ref_type||''}', '${r.ref_id||''}')">
        <div style="width:2rem;height:2rem;border-radius:.5rem;background:${tc.color}18;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">
          <i class="fas ${tc.icon}" style="color:${tc.color};font-size:.75rem"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-1">
            <p class="text-xs font-${isUnread?'bold':'semibold'} text-slate-900 leading-snug line-clamp-2">${r.title||''}${cnt>1?' <span style="font-size:.65rem;background:#e2e8f0;padding:.05rem .4rem;border-radius:.25rem;font-weight:700">×'+cnt+'</span>':''}</p>
            ${isUnread?'<span style="width:.5rem;height:.5rem;background:#3b82f6;border-radius:50%;flex-shrink:0;margin-top:.2rem"></span>':''}
          </div>
          ${r.body?`<p class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">${r.body}</p>`:''}
          <p class="text-[10px] text-slate-400 mt-0.5">${ago}</p>
        </div>
      </div>`;
    }).join('');
  }

  function handleDropdownNotifClick(id, refType, refId) {
    if (currentSession && id) {
      const url = new URL(API_URL);
      url.searchParams.set('path', 'notifications/read');
      url.searchParams.set('session_id', currentSession);
      url.searchParams.set('id', id);
      fetch(url.toString(), { cache: 'no-cache' })
        .then(() => {
          const el = document.querySelector(`[data-dropdown-notif-id="${id}"]`);
          if (el) el.remove();
          if (window.WVNotifications) window.WVNotifications.refreshBadge();
          _lastSeenIds.add(id);
        })
        .catch(() => {});
    }

    closeNotificationDropdown();
    if (refType && window.WorkVolt) {
      window.WorkVolt.navigate(refType);
      if (refId) {
        window._wvDeepLink = { module: refType, id: refId, action: 'detail' };
      }
    }
  }

  function updateNotifBadge(count) {
    const badge = document.getElementById('notif-badge');
    if (!badge) return;
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.classList.remove('hidden');
      badge.style.animation = 'none';
      void badge.offsetWidth;
    } else {
      badge.classList.add('hidden');
    }
  }

  function showCriticalBanner(notif) {
    const existing = document.getElementById('wv-critical-banner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.id = 'wv-critical-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99998;background:#dc2626;color:#fff;padding:.5rem 1rem;display:flex;align-items:center;justify-between;gap:.75rem;font-size:.8rem;font-weight:600;box-shadow:0 2px 8px rgba(220,38,38,.4)';
    banner.innerHTML = `
      <div style="display:flex;align-items:center;gap:.5rem;flex:1">
        <i class="fas fa-exclamation-triangle"></i>
        <span>${notif.title || 'Critical Alert'}</span>
        ${notif.body ? `<span style="font-weight:400;opacity:.9">— ${notif.body}</span>` : ''}
      </div>
      ${notif.ref_type ? `<button onclick="window.WorkVolt&&window.WorkVolt.navigate('${notif.ref_type}');document.getElementById('wv-critical-banner').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:.25rem .75rem;border-radius:.375rem;font-size:.72rem;font-weight:700;cursor:pointer">View →</button>` : ''}
      <button onclick="document.getElementById('wv-critical-banner').remove()" style="background:none;border:none;color:#fff;cursor:pointer;opacity:.8;font-size:.9rem">✕</button>`;
    document.body.insertBefore(banner, document.body.firstChild);
  }

  function toggleNotificationDropdown() {
    const dd = document.getElementById('notification-dropdown');
    dd.classList.toggle('hidden');
    if (!dd.classList.contains('hidden')) loadNotifications();
  }

  function closeNotificationDropdown() {
    const dd = document.getElementById('notification-dropdown');
    if (dd) dd.classList.add('hidden');
  }

  function loadNotifications() {
    const list = document.getElementById('notification-list');
    if (!currentSession) {
      if (list) list.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">Please log in to view notifications</div>';
      return;
    }
    const uid = currentUser?.user_id;
    if (!uid) return;

    const url = new URL(API_URL);
    url.searchParams.set('path', 'notifications/list');
    url.searchParams.set('session_id', currentSession);
    url.searchParams.set('user_id', uid);
    url.searchParams.set('filter', 'unread');
    url.searchParams.set('limit', '20');

    fetch(url.toString(), { cache:'no-cache' })
      .then(r => r.json())
      .then(data => {
        if (data.error) throw new Error(data.error);
        renderNotifDropdownItems(data.rows || [], data.unread || 0);
        updateNotifBadge(data.unread || 0);
      })
      .catch(() => {
        if (list) list.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">Could not load notifications</div>';
      });
  }

  function markAllNotificationsRead() {
    if (!currentSession) { closeNotificationDropdown(); return; }
    const uid = currentUser?.user_id;
    if (!uid) return;

    const url = new URL(API_URL);
    url.searchParams.set('path', 'notifications/read-all');
    url.searchParams.set('session_id', currentSession);
    url.searchParams.set('user_id', uid);
    fetch(url.toString(), { cache:'no-cache' })
      .then(() => { updateNotifBadge(0); showToast('All notifications marked as read', 'success'); closeNotificationDropdown(); })
      .catch(() => closeNotificationDropdown());
  }

  let _lastUnreadCount = 0;
  let _pollVisible = true;
  let _lastSeenIds = new Set();

  function _loadSeenIds() {
    try { return new Set(JSON.parse(sessionStorage.getItem('wv_notif_seen') || '[]')); }
    catch(e) { return new Set(); }
  }
  function _saveSeenIds(s) {
    try { sessionStorage.setItem('wv_notif_seen', JSON.stringify(Array.from(s).slice(-200))); }
    catch(e) {}
  }
  _lastSeenIds = _loadSeenIds();

  function _pollNotifications() {
    if (!currentSession) return;
    const uid = currentUser?.user_id;
    if (!uid || !_pollVisible) return;

    const url = new URL(API_URL);
    url.searchParams.set('path', 'notifications/list');
    url.searchParams.set('session_id', currentSession);
    url.searchParams.set('user_id', uid);
    url.searchParams.set('filter', 'unread');
    url.searchParams.set('limit', '20');

    fetch(url.toString(), { cache:'no-cache' })
      .then(r => r.json())
      .then(data => {
        if (data.error) return;
        const rows = data.rows || [];
        const unread = data.unread || 0;
        updateNotifBadge(unread);

        rows.forEach(r => {
          if (_lastSeenIds.has(r.id)) return;
          _lastSeenIds.add(r.id);
          _saveSeenIds(_lastSeenIds);

          const behavior = NOTIF_PRIORITY_BEHAVIOR[r.priority] || NOTIF_PRIORITY_BEHAVIOR.normal;
          if (r.priority === 'critical') showCriticalBanner(r);
          if (behavior.popup) showNotifPopup(r);
        });

        _lastUnreadCount = unread;
      })
      .catch(() => {});
  }

  function startNotificationPolling() {
    _pollNotifications();
    _notifPollTimer = setInterval(_pollNotifications, 30000);
    document.addEventListener('visibilitychange', () => {
      _pollVisible = !document.hidden;
      if (_pollVisible) _pollNotifications();
    });
  }

  function stopNotificationPolling() {
    if (_notifPollTimer) { clearInterval(_notifPollTimer); _notifPollTimer = null; }
  }

  window.WVNotifications = {
    create: function(params) {
      if (!currentSession || !params.to_user_id) return;
      const url = new URL(API_URL);
      url.searchParams.set('path', 'notifications/create');
      url.searchParams.set('session_id', currentSession);
      Object.keys(params).forEach(k => { if (params[k]) url.searchParams.set(k, params[k]); });
      fetch(url.toString(), { cache:'no-cache' }).catch(() => {});
    },
    refreshBadge: function() {
      if (!currentSession) return;
      const uid = currentUser?.user_id;
      if (!uid) return;
      const url = new URL(API_URL);
      url.searchParams.set('path', 'notifications/unread');
      url.searchParams.set('session_id', currentSession);
      url.searchParams.set('user_id', uid);
      fetch(url.toString(), { cache:'no-cache' }).then(r => r.json()).then(d => { if (!d.error) updateNotifBadge(d.unread || 0); }).catch(() => {});
    },
    showPopup: showNotifPopup,
  };

  // ─────────────────────────────────────────────
  //  USER MENU
  // ─────────────────────────────────────────────
  let _realUser = null;
  let _mimicking = false;

  function renderUserDropdown() {
    const inner = document.getElementById('user-dropdown-inner');
    if (!inner) return;

    const isSuperAdmin = (currentUser?.role === 'SuperAdmin');
    const isDemo = currentUser?._demo === true;

    inner.innerHTML = `
      <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Account</p>
        ${isDemo ? '<span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold">DEMO</span>' : ''}

        <i class="fas fa-user-circle text-slate-400 w-4"></i>My Profile
      </button>
      <button onclick="openSecurityModal(); closeUserMenu();" class="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
        <i class="fas fa-shield-alt text-slate-400 w-4"></i>Security & Password
      </button>
      
      ${isSuperAdmin && !isDemo ? `
      <div class="border-t border-slate-100"></div>
      <button onclick="openMimicModal(); closeUserMenu();" class="w-full px-4 py-2.5 text-left text-sm text-violet-700 hover:bg-violet-50 flex items-center gap-2.5 transition-colors">
        <i class="fas fa-user-secret text-violet-400 w-4"></i>Mimic Profile
        <span class="ml-auto text-[10px] text-violet-400 bg-violet-50 border border-violet-200 rounded px-1 font-bold">SA</span>
      </button>` : ''}
      
      <div class="border-t border-slate-100"></div>
      <button onclick="handleLogout()" class="w-full px-4 py-2.5 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-2.5 transition-colors">
        <i class="fas fa-sign-out-alt text-red-400 w-4"></i>Logout
      </button>
    `;

  function toggleUserMenu(e) {
    e?.stopPropagation();
    const dd = document.getElementById('user-dropdown');
    const wasHidden = dd.classList.contains('hidden');
    dd.classList.toggle('hidden');
    if (wasHidden) renderUserDropdown();
  }

  function closeUserMenu() {
    document.getElementById('user-dropdown').classList.add('hidden');
  }

  function openProfileModal() { showToast('Profile modal — coming soon', 'info'); }
  function openSecurityModal() { showToast('Security modal — coming soon', 'info'); }

  function openMimicModal() {
    if (!currentSession) {
      showToast('Please log in first', 'error'); return;
    }

    const url = new URL(API_URL);
    url.searchParams.set('path', 'users/list');
    url.searchParams.set('session_id', currentSession);
    fetch(url.toString(), { cache: 'no-cache' })
      .then(r => r.json())
      .then(data => {
        const users = (data.users || data.rows || [])
          .filter(u => (u.user_id || u.id) !== currentUser?.user_id && u.active !== false && u.active !== 'false');
        renderMimicModal(users);
      })
      .catch(() => showToast('Could not load users', 'error'));
  }

  function renderMimicModal(users) {
    const ROLE_COLORS = {
      SuperAdmin: 'bg-red-100 text-red-700',
      Admin: 'bg-orange-100 text-orange-700',
      Manager: 'bg-blue-100 text-blue-700',
      Employee: 'bg-green-100 text-green-700',
      Contractor: 'bg-slate-100 text-slate-600',
    };
    const ROLE_ICONS = {
      SuperAdmin:'fa-crown', Admin:'fa-shield-alt', Manager:'fa-user-tie',
      Employee:'fa-user', Contractor:'fa-user-clock',
    };

    const byRole = {};
    users.forEach(u => {
      const r = u.role || 'Employee';
      if (!byRole[r]) byRole[r] = [];
      byRole[r].push(u);
    });
    const roleOrder = ['SuperAdmin','Admin','Manager','Employee','Contractor'];

    const rows = roleOrder.filter(r => byRole[r]).map(role => {
      const rc = ROLE_COLORS[role] || 'bg-slate-100 text-slate-600';
      const ri = ROLE_ICONS[role] || 'fa-user';
      const items = byRole[role].map(u => {
        const uid = u.user_id || u.id;
        const init = (u.name||'?').charAt(0).toUpperCase();
        const colors = ['bg-blue-100 text-blue-600','bg-violet-100 text-violet-600','bg-emerald-100 text-emerald-600','bg-amber-100 text-amber-600','bg-rose-100 text-rose-600'];
        const avatarCls = colors[uid.charCodeAt(0) % colors.length];
        return `<button data-uid="${uid}" data-name="${(u.name||u.email||'').replace(/"/g,'')}" 
          data-role="${role}" data-email="${(u.email||'').replace(/"/g,'')}"
          data-dept="${(u.department||'').replace(/"/g,'')}" data-title="${(u.job_title||'').replace(/"/g,'')}"
          onclick="startMimicking(this)"
          class="w-full flex items-center gap-3 px-4 py-3 hover:bg-violet-50 transition-colors text-left border-b border-slate-50 last:border-0">
          <div class="w-9 h-9 rounded-xl ${avatarCls} flex items-center justify-center font-bold text-sm flex-shrink-0">${init}</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-slate-900 truncate">${u.name||'—'}</p>
            <p class="text-xs text-slate-400 truncate">${u.email||''}</p>
          </div>
          <span class="flex-shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded ${rc}">${role}</span>
        </button>`;
      }).join('');
      return `<div>
        <div class="px-4 py-2 bg-slate-50 border-y border-slate-100 flex items-center gap-2">
          <i class="fas ${ri} text-slate-400 text-xs"></i>
          <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wide">${role}</span>
          <span class="text-[10px] text-slate-400">${byRole[role].length}</span>
        </div>
        ${items}
      </div>`;
    }).join('');

    const modal = document.createElement('div');
    modal.id = 'wv-mimic-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem';
    modal.innerHTML = `
      <div style="background:#fff;border-radius:1.25rem;box-shadow:0 30px 70px rgba(0,0,0,.25);width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:1.25rem 1.5rem;border-bottom:1px solid #f1f5f9;flex-shrink:0">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <h3 style="font-size:1rem;font-weight:800;color:#0f172a;display:flex;align-items:center;gap:.5rem">
                <i class="fas fa-user-secret" style="color:#7c3aed"></i> Mimic Profile
              </h3>
              <p style="font-size:.72rem;color:#94a3b8;margin-top:.2rem">View the app as another user. You can stop mimicking at any time from the avatar menu.</p>
            </div>
            <button onclick="document.getElementById('wv-mimic-modal').remove()" 
              style="width:2rem;height:2rem;border-radius:.5rem;border:none;background:transparent;cursor:pointer;color:#94a3b8;font-size:.9rem">✕</button>
          </div>
          <div style="margin-top:.75rem;position:relative">
            <i class="fas fa-search" style="position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:#cbd5e1;font-size:.75rem"></i>
            <input id="mimic-search" type="text" placeholder="Search by name or email…" oninput="filterMimicList(this.value)"
              style="width:100%;padding:.5rem .75rem .5rem 2.25rem;border:1.5px solid #e2e8f0;border-radius:.625rem;font-size:.8rem;outline:none;font-family:inherit;box-sizing:border-box">
          </div>
        </div>
        <div id="mimic-list" style="overflow-y:auto;flex:1">
          ${users.length ? rows : '<div style="padding:3rem;text-align:center;color:#94a3b8"><i class="fas fa-users" style="font-size:2rem;opacity:.3;display:block;margin-bottom:.75rem"></i><p>No other users found</p></div>'}
        </div>
      </div>`;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
    modal._users = users;
    setTimeout(() => document.getElementById('mimic-search')?.focus(), 80);
  }

  function filterMimicList(q) {
    const modal = document.getElementById('wv-mimic-modal');
    if (!modal || !modal._users) return;
    const filtered = q
      ? modal._users.filter(u => (u.name||'').toLowerCase().includes(q.toLowerCase()) || (u.email||'').toLowerCase().includes(q.toLowerCase()))
      : modal._users;
    renderMimicModal(filtered);
    const newModal = document.getElementById('wv-mimic-modal');
    if (newModal) newModal._users = modal._users;
  }

  function startMimicking(btn) {
    if (currentUser?.role !== 'SuperAdmin' && !_realUser) return;

    if (!_mimicking) _realUser = Object.assign({}, currentUser);
    _mimicking = true;

    currentUser = {
      user_id: btn.dataset.uid,
      name: btn.dataset.name,
      email: btn.dataset.email,
      role: btn.dataset.role,
      department: btn.dataset.dept,
      job_title: btn.dataset.title,
      active: true,
      _mimicked: true,
    };

    window.WorkVolt = Object.assign(window.WorkVolt || {}, { user: () => currentUser });

    const name = currentUser.name || 'User';
    const initials = name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-avatar').textContent = initials;
    document.getElementById('user-avatar').style.background = 'linear-gradient(135deg,#7c3aed,#6d28d9)';

    let banner = document.getElementById('wv-mimic-banner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'wv-mimic-banner';
      banner.style.cssText = 'position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:9998;background:#7c3aed;color:#fff;border-radius:999px;padding:.45rem 1.25rem;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:.75rem;box-shadow:0 8px 24px rgba(124,58,237,.4);white-space:nowrap;cursor:default';
      banner.innerHTML = `<i class="fas fa-user-secret"></i><span id="wv-mimic-banner-text"></span><button onclick="stopMimicking()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:.2rem .65rem;border-radius:999px;font-size:.7rem;font-weight:700;cursor:pointer;margin-left:.25rem">Stop</button>`;
      document.body.appendChild(banner);
    }
    document.getElementById('wv-mimic-banner-text').textContent = 'Viewing as ' + name + ' (' + btn.dataset.role + ')';

    document.getElementById('wv-mimic-modal')?.remove();
    renderNav();
    showToast('Now viewing as ' + name, 'info');
    showModule('dashboard');
  }

  function stopMimicking() {
    if (!_realUser) return;
    currentUser = Object.assign({}, _realUser);
    _mimicking = false;
    _realUser = null;

    window.WorkVolt = Object.assign(window.WorkVolt || {}, { user: () => currentUser });

    const name = currentUser.name || 'Super Admin';
    const initials = name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-avatar').textContent = initials;
    document.getElementById('user-avatar').style.background = '';

    document.getElementById('wv-mimic-banner')?.remove();

    renderNav();
    showToast('Back to your Super Admin view', 'success');
    showModule('dashboard');
  }

  // ─────────────────────────────────────────────
  //  MOBILE SIDEBAR
  // ─────────────────────────────────────────────
  function toggleSidebarCollapse() {
    const sidebar = document.getElementById('sidebar');
    const collapsed = sidebar.classList.toggle('collapsed');
    localStorage.setItem('wv_sidebar_collapsed', collapsed ? '1' : '0');
  }

  function applySidebarCollapse() {
    if (localStorage.getItem('wv_sidebar_collapsed') === '1') {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  }

  function toggleMobileSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('visible');
  }
  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('visible');
  }

  // ─────────────────────────────────────────────
  //  TOAST
  // ─────────────────────────────────────────────
  function showToast(msg, type = 'info', duration = 3500) {
    const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle', warning:'fa-triangle-exclamation' };
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'toastOut .3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // ─────────────────────────────────────────────
  //  MODULES & PERMISSIONS
  // ─────────────────────────────────────────────
  const ADDON_CATALOGUE = {
    notifications: { label: 'Notifications', icon: 'fa-bell', roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    tasks: { label: 'Tasks', icon: 'fa-check-circle', roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    pipeline: { label: 'Pipeline', icon: 'fa-users', roles: ['SuperAdmin','Admin','Manager'] },
    payroll: { label: 'Payroll', icon: 'fa-money-bill-wave', roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    timesheets: { label: 'Timesheets', icon: 'fa-clock', roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    financials: { label: 'Financials', icon: 'fa-chart-line', roles: ['SuperAdmin','Admin','Manager'] },
    crm: { label: 'CRM', icon: 'fa-address-book', roles: ['SuperAdmin','Admin','Manager'] },
    projects: { label: 'Projects', icon: 'fa-folder-open', roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    reports: { label: 'Reports', icon: 'fa-chart-pie', roles: ['SuperAdmin','Admin','Manager'] },
    assets: { label: 'Assets', icon: 'fa-box-open', roles: ['SuperAdmin','Admin','Manager','Employee'] },
    attendance: { label: 'Attendance Tracker', icon: 'fa-calendar-check', roles: ['SuperAdmin','Admin','Manager','Employee'] },
    invoices: { label: 'Invoice Manager', icon: 'fa-file-invoice-dollar', roles: ['SuperAdmin','Admin','Manager'] },
    inventory: { label: 'Inventory Control', icon: 'fa-warehouse', roles: ['SuperAdmin','Admin','Manager'] },
    scheduler: { label: 'Shift Scheduler', icon: 'fa-calendar-alt', roles: ['SuperAdmin','Admin','Manager'] },
    expenses: { label: 'Expense Claims', icon: 'fa-receipt', roles: ['SuperAdmin','Admin','Manager','Employee','Contractor'] },
    contracts: { label: 'Contract Hub', icon: 'fa-file-signature', roles: ['SuperAdmin','Admin','Manager'] },
    helpdesk: { label: 'Help Desk', icon: 'fa-headset', roles: ['SuperAdmin','Admin','Manager','Employee'] },
    recruitment: { label: 'Recruitment Pipeline', icon: 'fa-user-tie', roles: ['SuperAdmin','Admin','Manager'] },
  };

  let INSTALLED_MODULES = [];
  window.INSTALLED_MODULES = INSTALLED_MODULES;

  function saveInstalledModules() {
    try {
      localStorage.setItem('wv_installed_modules', JSON.stringify(INSTALLED_MODULES));
    } catch(e) {
      console.warn('Could not save modules to localStorage:', e.message);
    }
  }

  async function loadInstalledModules() {
    const savedUrl = localStorage.getItem('wv_gas_url') || '';
    if (savedUrl) { API_URL = savedUrl; window.API_URL = savedUrl; }

    if (savedUrl && currentSession) {
      try {
        const url = new URL(savedUrl);
        url.searchParams.set('path', 'config/modules');
        url.searchParams.set('session_id', currentSession);
        url.searchParams.set('_t', Date.now().toString());
        const res = await fetch(url.toString(), { cache: 'no-cache' });
        const data = await res.json();
        if (data.modules) {
          INSTALLED_MODULES = data.modules;
          window.INSTALLED_MODULES = INSTALLED_MODULES;
        }
      } catch(e) {
        console.warn('Could not load modules from Sheet, trying localStorage:', e.message);
      }
    }
    
    if (!INSTALLED_MODULES || INSTALLED_MODULES.length === 0) {
      try {
        const saved = localStorage.getItem('wv_installed_modules');
        if (saved) {
          INSTALLED_MODULES = JSON.parse(saved);
          window.INSTALLED_MODULES = INSTALLED_MODULES;
        }
      } catch(e) {
        console.warn('Could not load modules from localStorage:', e.message);
      }
    }
  }

  async function loadRolePermissions() {
    const savedUrl = localStorage.getItem('wv_gas_url') || '';

    try {
      const local = JSON.parse(localStorage.getItem('wv_role_permissions') || 'null');
      if (local) _rolePermissions = local;
      const localOv = JSON.parse(localStorage.getItem('wv_user_overrides') || 'null');
      if (localOv) _userModuleOverrides = localOv;
    } catch(e) {}

    if (!savedUrl || !currentSession) return;

    try {
      const url = new URL(savedUrl);
      url.searchParams.set('path', 'config/get-all');
      url.searchParams.set('session_id', currentSession);
      url.searchParams.set('_t', Date.now().toString());
      const res = await fetch(url.toString(), { cache: 'no-cache' });
      const data = await res.json();
      const settings = data.settings || {};
      if (settings.role_permissions) {
        try { _rolePermissions = JSON.parse(settings.role_permissions); } catch(e) {}
      }
      if (settings.user_module_overrides) {
        try { _userModuleOverrides = JSON.parse(settings.user_module_overrides); } catch(e) {}
      }
    } catch(e) {
      console.warn('Could not load role permissions:', e.message);
    }
  }

  function resolvedRolesForModule(moduleId) {
    if (_rolePermissions[moduleId]) {
      return Object.entries(_rolePermissions[moduleId])
        .filter(([, allowed]) => allowed)
        .map(([role]) => role);
    }
    const def = ADDON_CATALOGUE[moduleId];
    return (def && def.roles) || [];
  }

  function canAccessModule(moduleId) {
    const role = currentUser?.role || 'Employee';
    const userId = currentUser?.user_id || '';

    if (moduleId === 'dashboard') return true;
    if (MODULE_ROLES[moduleId]) return MODULE_ROLES[moduleId].includes(role);
    if (role === 'SuperAdmin') return true;

    if (_userModuleOverrides[userId]) {
      return _userModuleOverrides[userId].includes(moduleId);
    }

    return resolvedRolesForModule(moduleId).includes(role);
  }

  // ─────────────────────────────────────────────
  //  CLOSE DROPDOWNS ON OUTSIDE CLICK
  // ─────────────────────────────────────────────
  document.addEventListener('click', e => {
    if (!document.getElementById('user-menu-container')?.contains(e.target))
      closeUserMenu();
    if (!document.getElementById('notification-dropdown')?.contains(e.target)
        && !e.target.closest('button[onclick*="toggleNotificationDropdown"]'))
      closeNotificationDropdown();
  });

  // Expose globals
  window.WorkVolt = {
    api: apiCall,
    user: () => currentUser,
    session: () => currentSession,
    toast: showToast,
    navigate: showModule,
  };
  window.WorkVoltPages = window.WorkVoltPages || {};
  window.renderNav = renderNav;
  window._wvRolePermissions = () => _rolePermissions;
  window._wvUserOverrides = () => _userModuleOverrides;
  window._wvApplyPermissions = function(perms, overrides) {
    if (perms) _rolePermissions = perms;
    if (overrides) _userModuleOverrides = overrides;
    renderNav();
  };

  // ─────────────────────────────────────────────
  //  BOOT SEQUENCE
  // ─────────────────────────────────────────────
  window.addEventListener('load', async () => {
    // Check login state and route accordingly
    const state = await checkLoginState();
    
    hideSplash();
    
    if (state.state === 'authenticated') {
      // User is logged in, show app
      document.getElementById('app-screen').classList.remove('hidden');
      await showApp();
    } else {
      // Show login screen
      document.getElementById('login-screen').classList.remove('hidden');
      renderLoginState(state);
    }
  });

  </script>
</body>
</html>
