<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Volt - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .field { width:100%; padding:.75rem 1rem; border:1.5px solid #e2e8f0; border-radius:12px; font-size:.875rem; outline:none; transition:border-color .15s, box-shadow .15s; }
    .field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .btn-primary { display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.75rem 1.5rem; background:#2563eb; color:#fff; border:none; border-radius:12px; font-size:.875rem; font-weight:600; cursor:pointer; transition:background .15s, transform .1s; }
    .btn-primary:hover { background:#1d4ed8; }
    .btn-primary:active { transform:scale(.98); }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; }
    .btn-lang { display:inline-flex; align-items:center; gap:.4rem; padding:.4rem .9rem; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); border-radius:9px; font-size:.75rem; font-weight:700; color:#fff; cursor:pointer; transition:background .15s; backdrop-filter:blur(4px); letter-spacing:.03em; font-family:inherit; }
    .btn-lang:hover { background:rgba(255,255,255,0.25); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .shake { animation: shake 0.3s ease-in-out; }
  </style>
<script src="translations.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 flex items-center justify-center p-4">

  <!-- Language toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button id="lang-btn" onclick="toggleIndexLang()" class="btn-lang">
      <i class="fas fa-globe text-xs"></i>
      <span id="lang-btn-label">Français</span>
    </button>
  </div>

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 bg-white/15 border border-white/30 rounded-2xl flex items-center justify-center mb-4 backdrop-blur-sm">
        <i class="fas fa-bolt text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Work Volt</h1>
      <p id="txt-tagline" class="text-blue-200 mt-1 text-sm font-medium">Power your operations</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="bg-blue-50 border-b border-blue-100 px-6 py-3 flex items-center gap-2">
        <i class="fas fa-shield-alt text-blue-500"></i>
        <span id="txt-secure" class="text-xs font-bold text-blue-700 uppercase tracking-wide">Secure Sign In</span>
      </div>

      <div class="p-6 space-y-4">
        <!-- Error Message -->
        <div id="login-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-600 flex items-center gap-2">
          <i class="fas fa-exclamation-circle"></i>
          <span id="error-text"></span>
        </div>

        <!-- GAS URL ONLY -->
        <div>
          <label id="lbl-url" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Work Volt URL</label>
          <input id="gas-url" type="url" class="field" placeholder="https://script.google.com/macros/s/.../exec">
          <p id="lbl-url-hint" class="text-xs text-slate-400 mt-1">Your Google Apps Script Web App URL</p>
        </div>

        <!-- Username -->
        <div>
          <label id="lbl-email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Username (Email)</label>
          <input id="username" type="email" class="field" placeholder="admin@workvolt.app" autocomplete="off">
        </div>

        <!-- Password -->
        <div>
          <label id="lbl-password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Password</label>
          <div class="relative">
            <input id="password" type="password" class="field pr-10" placeholder="••••••••" autocomplete="off">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i id="eye-icon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <button onclick="doLogin()" id="login-btn" class="btn-primary w-full mt-2">
          <i class="fas fa-sign-in-alt"></i>
          <span id="txt-login-btn">Sign In</span>
        </button>

        <!-- Hint -->
        <div id="reset-hint" class="hidden mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-700">
          <i class="fas fa-info-circle mr-1"></i>
          <span id="txt-reset-hint">Contact your SuperAdmin to reset your password.</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p id="txt-footer" class="text-center text-blue-200/60 text-xs mt-6">
      Work Volt v1.0.0 • Secure Business Management
    </p>
  </div>

  <script>
    // ─────────────────────────────────────────────
    //  LANGUAGE HANDLING (index page)
    // ─────────────────────────────────────────────
    function applyIndexLang() {
      if (!window.WorkVoltI18n) return;
      const i18n = window.WorkVoltI18n;
      const tl   = k => i18n.t(k);
      document.documentElement.lang = i18n.getLang();

      document.getElementById('txt-tagline').textContent       = tl('splash.tagline');
      document.getElementById('txt-secure').textContent        = tl('login.secure');
      document.getElementById('lbl-url').textContent           = tl('login.url_label');
      document.getElementById('gas-url').placeholder          = tl('login.url_placeholder');
      document.getElementById('lbl-url-hint').textContent      = tl('login.url_hint');
      document.getElementById('lbl-email').textContent         = tl('login.email_label');
      document.getElementById('username').placeholder          = tl('login.email_placeholder');
      document.getElementById('lbl-password').textContent      = tl('login.password_label');
      document.getElementById('txt-login-btn').textContent     = tl('login.btn');
      document.getElementById('txt-reset-hint').textContent    = tl('login.reset_hint');
      document.getElementById('txt-footer').textContent        = tl('login.footer');
      // Button label shows the other language you can switch TO
      document.getElementById('lang-btn-label').textContent    = tl('login.language');
    }

    function toggleIndexLang() {
      if (window.WorkVoltI18n) window.WorkVoltI18n.toggleLang();
      applyIndexLang();
    }

    // Apply on load
    applyIndexLang();

    // ─────────────────────────────────────────────
    //  LOGIN LOGIC - NO LOCAL STORAGE (Session Only)
    // ─────────────────────────────────────────────

    // Parse URL parameter for gas_url only (not stored)
    const params = new URLSearchParams(window.location.search);
    if (params.get('gas_url')) {
      document.getElementById('gas-url').value = params.get('gas_url');
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showError(msg) {
      const box = document.getElementById('login-error');
      const text = document.getElementById('error-text');
      text.textContent = msg;
      box.classList.remove('hidden');
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 300);
    }

    function hideError() {
      document.getElementById('login-error').classList.add('hidden');
    }

    async function doLogin() {
      const tl  = k => window.WorkVoltI18n ? window.WorkVoltI18n.t(k) : k;
      const btn = document.getElementById('login-btn');
      const url = document.getElementById('gas-url').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      hideError();

      if (!url)      return showError(tl('login.err.no_url'));
      if (!username) return showError(tl('login.err.no_email'));
      if (!password) return showError(tl('login.err.no_password'));

      btn.disabled = true;
      const originalContent = btn.innerHTML;
      btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i><span>${tl('login.btn_loading')}</span>`;

      try {
        // Hash password (SHA-256)
        const msgBuffer = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const passwordHash = Array.from(new Uint8Array(hashBuffer))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');

        // Call GAS login endpoint
        const loginUrl = new URL(url);
        loginUrl.searchParams.set('path', 'auth/login');
        loginUrl.searchParams.set('email', username);
        loginUrl.searchParams.set('password_hash', passwordHash);

        const res = await fetch(loginUrl.toString(), { cache: 'no-cache' });
        const data = await res.json();

        if (data.error) throw new Error(data.error);
        if (!data.success || !data.user) throw new Error('Login failed');

        // Store ONLY in sessionStorage (cleared when tab closes) + memory
        sessionStorage.setItem('wv_gas_url', url);
        sessionStorage.setItem('wv_session', data.session_id);
        sessionStorage.setItem('wv_user', JSON.stringify(data.user));

        window.sessionData = {
          gas_url: url,
          session_id: data.session_id,
          user: data.user
        };

        window.location.href = 'main.html';

      } catch(e) {
        showError(e.message || tl('login.err.failed'));
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }
    }

    // Allow Enter key to submit
    document.getElementById('password')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
