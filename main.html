<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Volt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    .fade-in  { animation: fadeIn 0.25s ease both; }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    #splash-screen { transition: opacity 0.4s ease, visibility 0.4s ease; }
    #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .bolt-pulse { animation: boltPulse 2s ease-in-out infinite; }
    @keyframes boltPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.85} }
    .nav-item { transition: background 0.15s, color 0.15s; }
    .nav-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    .card-hover { transition: transform 0.18s, box-shadow 0.18s; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 28px -6px rgba(0,0,0,.12); }
    .field { width:100%; padding:.6rem .875rem; border:1.5px solid #e2e8f0; border-radius:10px; font-size:.875rem; outline:none; transition:border-color .15s, box-shadow .15s; }
    .field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .btn-primary { display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.65rem 1.25rem; background:#2563eb; color:#fff; border:none; border-radius:10px; font-size:.875rem; font-weight:600; cursor:pointer; }
    .btn-primary:hover { background:#1d4ed8; }
    #toast-container { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; display:flex; flex-direction:column; gap:.5rem; }
    .toast { display:flex; align-items:center; gap:.75rem; padding:.75rem 1.1rem; border-radius:12px; font-size:.875rem; font-weight:500; color:#fff; }
    .toast.success { background:#16a34a; }
    .toast.error   { background:#dc2626; }
    .thin-scroll::-webkit-scrollbar { width:4px; }
    #sidebar { transition: width .22s; }
    #sidebar.collapsed { width: 56px !important; }
    #sidebar.collapsed .nav-label, #sidebar.collapsed .sidebar-footer-text { display: none !important; }
    @media (max-width: 768px) {
      #sidebar { position:fixed; top:0; left:0; height:100vh; z-index:50; transform:translateX(-100%); }
      #sidebar.open { transform:translateX(0); }
    }
  </style>
</head>
<body class="min-h-screen">

  <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800">
    <div class="flex flex-col items-center gap-8">
      <div class="relative">
        <div class="absolute inset-0 bg-white/20 rounded-3xl blur-xl scale-110"></div>
        <div class="relative inline-flex items-center justify-center w-24 h-24 bg-white/15 border border-white/30 rounded-3xl shadow-2xl backdrop-blur-sm bolt-pulse">
          <i class="fas fa-bolt text-white text-5xl"></i>
        </div>
      </div>
      <div class="text-center">
        <h1 class="text-4xl font-extrabold text-white tracking-tight">Work Volt</h1>
        <p class="text-blue-200 mt-1.5 text-base font-medium">Power your operations</p>
      </div>
    </div>
  </div>

  <div id="app-screen" class="hidden flex flex-col min-h-screen">
    <header class="bg-white border-b border-slate-200 px-4 h-14 flex items-center gap-3 sticky top-0 z-30">
      <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 hover:bg-slate-100 rounded-lg"><i class="fas fa-bars text-slate-600"></i></button>
      <div class="flex items-center gap-2 cursor-pointer" onclick="showModule('dashboard')">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><i class="fas fa-bolt text-white text-sm"></i></div>
        <span class="text-lg font-extrabold text-slate-900">Work Volt</span>
      </div>
      <div class="flex-1 max-w-sm mx-4 hidden md:block">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="global-search" placeholder="Search..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>
      <div class="ml-auto flex items-center gap-1">
        <div class="relative" id="user-menu-container">
          <button onclick="toggleUserMenu(event)" class="flex items-center gap-2 pl-3 border-l border-slate-200 hover:bg-slate-100 rounded-lg p-2">
            <div id="user-avatar" class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-sm">JD</div>
            <span id="user-name" class="hidden md:block text-sm font-semibold text-slate-700">User</span>
            <i class="fas fa-chevron-down text-xs text-slate-400"></i>
          </button>
          <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-xl shadow-xl border border-slate-200 z-50">
            <div id="user-dropdown-inner"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <div id="sidebar-overlay" onclick="closeMobileSidebar()" class="hidden fixed inset-0 bg-black/40 z-40"></div>
      <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col">
        <nav class="flex-1 overflow-y-auto thin-scroll p-3" id="nav-menu"></nav>
        <div class="p-3 border-t border-slate-100 flex items-center justify-between">
          <p class="text-[10px] text-slate-400 sidebar-footer-text">Work Volt · v1.0.0</p>
          <button onclick="toggleSidebarCollapse()" class="w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-chevron-left text-xs"></i></button>
        </div>
      </aside>
      <main class="flex-1 overflow-y-auto bg-slate-50" id="main-content"></main>
    </div>
  </div>

  <div id="modals-root"></div>
  <div id="toast-container"></div>

  <script>
  let API_URL = '';
  let currentUser = null;
  let currentSession = null;

  const MODULE_ROLES = {
    dashboard: ['SuperAdmin','Admin','Manager','Employee','Contractor'],
    settings: ['SuperAdmin','Admin'],
    store: ['SuperAdmin','Admin'],
    roles: ['SuperAdmin','Admin'],
  };

  let _rolePermissions = {};
  let _userModuleOverrides = {};

  async function loadRolePermissions() {
    const savedUrl = sessionStorage.getItem('wv_gas_url') || '';
    if (!savedUrl || !currentSession) return;
    try {
      const data = await apiCall('config/get-all');
      const settings = data.settings || {};
      if (settings.role_permissions) {
        try { _rolePermissions = JSON.parse(settings.role_permissions); } catch(e) {}
      }
    } catch(e) {
      console.warn('Could not load permissions:', e.message);
    }
  }

  function canAccessModule(moduleId) {
    const role = currentUser?.role || 'Employee';
    const userId = currentUser?.user_id || '';
    if (moduleId === 'dashboard') return true;
    if (MODULE_ROLES[moduleId]) return MODULE_ROLES[moduleId].includes(role);
    if (role === 'SuperAdmin') return true;
    if (_userModuleOverrides[userId]) return _userModuleOverrides[userId].includes(moduleId);
    return (_rolePermissions[moduleId] || []).includes(role);
  }

  const ADDON_CATALOGUE = {
    tasks: { label: 'Tasks', icon: 'fa-check-circle' },
    payroll: { label: 'Payroll', icon: 'fa-money-bill-wave' },
    timesheets: { label: 'Timesheets', icon: 'fa-clock' },
  };

  let INSTALLED_MODULES = [];

  async function loadInstalledModules() {
    const savedUrl = sessionStorage.getItem('wv_gas_url') || '';
    if (savedUrl) API_URL = savedUrl;
    if (savedUrl && currentSession) {
      try {
        const data = await apiCall('config/modules');
        if (data.modules) INSTALLED_MODULES = data.modules;
      } catch(e) {
        console.warn('Could not load modules:', e.message);
      }
    }
  }

  // ─────────────────────────────────────────────
  //  API HELPER - NO TOKEN, uses session_id only
  // ─────────────────────────────────────────────
  async function apiCall(path, params = {}, retries = 2) {
    const savedUrl = sessionStorage.getItem('wv_gas_url') || API_URL;
    const url = new URL(savedUrl);
    url.searchParams.set('path', path);
    url.searchParams.set('_t', Date.now().toString());
    if (currentSession) url.searchParams.set('session_id', currentSession);
    for (const k in params) {
      if (params[k] !== undefined) url.searchParams.set(k, params[k]);
    }

    let lastErr;
    for (let i = 0; i <= retries; i++) {
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 15000);
        const res = await fetch(url.toString(), { signal: ctrl.signal, cache: 'no-cache' });
        clearTimeout(tid);

        if (res.status === 401 || res.status === 403) {
          throw new Error('SESSION_INVALID');
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const text = await res.text();
        const data = JSON.parse(text);

        if (data.error) {
          if (data.code === 'SESSION_EXPIRED' || data.code === 'INVALID_SESSION') {
            throw new Error('SESSION_INVALID');
          }
          throw new Error(data.error);
        }
        return data;
      } catch(err) {
        lastErr = err;
        if (err.message === 'SESSION_INVALID') {
          forceLogout('Session expired. Please sign in again.');
          throw new Error('Session expired');
        }
        if (i < retries) await new Promise(r => setTimeout(r, 800 * (i + 1)));
      }
    }
    throw lastErr || new Error('Network error');
  }

  function hideSplash() {
    const s = document.getElementById('splash-screen');
    s.classList.add('hidden');
    setTimeout(() => s.style.display = 'none', 450);
  }

  function handleLogout() {
    sessionStorage.clear();
    currentUser = null;
    currentSession = null;
    window.location.href = 'index.html';
  }

  function forceLogout(msg) {
    sessionStorage.clear();
    currentUser = null;
    currentSession = null;
    if (msg) showToast(msg, 'error');
    window.location.href = 'index.html';
  }

  async function showApp() {
    hideSplash();
    document.getElementById('app-screen').classList.remove('hidden');
    const name = currentUser?.name || 'User';
    const initials = name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-avatar').textContent = initials;
    renderNav();
    const lastModule = sessionStorage.getItem('lastModule') || 'dashboard';
    showModule(lastModule, false);
  }

  function renderNav() {
    const nav = document.getElementById('nav-menu');
    const role = currentUser?.role || 'Employee';
    const dashLink = `<a href="#dashboard" onclick="showModule('dashboard'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium" data-module="dashboard"><i class="fas fa-th-large w-4 text-slate-400"></i><span class="nav-label">Dashboard</span></a>`;
    
    let addons = INSTALLED_MODULES.filter(m => canAccessModule(m.id));
    const addonLinks = addons.length ? `<div class="px-3 pt-4 pb-1"><p class="text-[10px] font-bold text-slate-400 uppercase">Modules</p></div><div class="space-y-0.5">${addons.map(m => `<a href="#${m.id}" onclick="showModule('${m.id}'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium" data-module="${m.id}"><i class="fas ${m.icon} w-4 text-slate-400"></i><span class="nav-label">${m.label}</span></a>`).join('')}</div>` : '';
    
    const bottomLinks = `<div class="border-t border-slate-100 mt-2 pt-2 space-y-0.5">${MODULE_ROLES.settings.includes(role) ? `<a href="#settings" onclick="showModule('settings'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium" data-module="settings"><i class="fas fa-cog w-4 text-slate-400"></i><span class="nav-label">Settings</span></a>` : ''}${MODULE_ROLES.store.includes(role) ? `<a href="#store" onclick="showModule('store'); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium" data-module="store"><i class="fas fa-store w-4 text-slate-400"></i><span class="nav-label">Module Store</span></a>` : ''}</div>`;
    
    nav.innerHTML = dashLink + addonLinks + bottomLinks;
  }

  function showModule(name, push = true) {
    closeMobileSidebar();
    sessionStorage.setItem('lastModule', name);
    if (push) history.pushState({ module: name }, '', '#' + name);
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.module === name));
    document.getElementById('main-content').innerHTML = `<div class="flex items-center justify-center h-64"><i class="fas fa-circle-notch fa-spin text-3xl text-blue-500"></i></div>`;
    setTimeout(() => {
      document.getElementById('main-content').innerHTML = `<div class="p-6"><h2 class="text-2xl font-bold text-slate-800">${name}</h2><p class="text-slate-500">Module content loading...</p></div>`;
    }, 100);
  }

  function toggleUserMenu(e) {
    e?.stopPropagation();
    const dd = document.getElementById('user-dropdown');
    const wasHidden = dd.classList.contains('hidden');
    dd.classList.toggle('hidden');
    if (wasHidden) renderUserDropdown();
  }

  function closeUserMenu() {
    document.getElementById('user-dropdown').classList.add('hidden');
  }

  function renderUserDropdown() {
    const inner = document.getElementById('user-dropdown-inner');
    const isSuperAdmin = (currentUser?.role === 'SuperAdmin');
    inner.innerHTML = `<div class="px-4 py-2 border-b border-slate-100 bg-slate-50"><p class="text-xs font-semibold text-slate-400 uppercase">Account</p></div><button onclick="closeUserMenu()" class="w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2"><i class="fas fa-user-circle text-slate-400"></i>My Profile</button>${isSuperAdmin ? `<button onclick="closeUserMenu()" class="w-full px-4 py-2 text-left text-sm text-violet-700 hover:bg-violet-50 flex items-center gap-2"><i class="fas fa-user-secret text-violet-400"></i>Mimic Profile<span class="ml-auto text-[10px] text-violet-400 bg-violet-50 border border-violet-200 rounded px-1">SA</span></button>` : ''}<div class="border-t border-slate-100"></div><button onclick="handleLogout()" class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"><i class="fas fa-sign-out-alt text-red-400"></i>Logout</button>`;
  }

  function toggleSidebarCollapse() {
    document.getElementById('sidebar').classList.toggle('collapsed');
  }

  function toggleMobileSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('hidden');
  }

  function closeMobileSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }

  function showToast(msg, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  document.addEventListener('click', e => {
    if (!document.getElementById('user-menu-container')?.contains(e.target)) closeUserMenu();
  });

  window.WorkVolt = { api: apiCall, user: () => currentUser, toast: showToast, navigate: showModule };

  window.addEventListener('load', async () => {
    try {
      const savedUser = sessionStorage.getItem('wv_user');
      const savedSession = sessionStorage.getItem('wv_session');
      const savedUrl = sessionStorage.getItem('wv_gas_url');

      if (!savedUser || !savedSession || !savedUrl) {
        window.location.href = 'index.html';
        return;
      }

      API_URL = savedUrl;
      currentUser = JSON.parse(savedUser);
      currentSession = savedSession;

      await loadInstalledModules();
      await loadRolePermissions();
      await showApp();
    } catch (err) {
      console.error('Boot error:', err);
      window.location.href = 'index.html';
    }
  });
  </script>
</body>
</html>
